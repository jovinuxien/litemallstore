spring:
  application:
    name: GOODS-SERVICE-APP
  cloud:
    loadbalancer:
      ribbon:
        enabled: true
    stream:
      bindings:
        output:
          destination: your-topic-name
          content-type: application/json
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
#      kafka:
#        binder:
#        brokers: localhost:9092
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: http://localhost:9080/realms/jhipster
        registration:
          oidc:
            client-id: internal
            client-secret: internal
            scope: openid, profile, email, offline_access # last one for refresh tokens
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9080/realms/jhipster/protocol/openid-connect/certs
          #issuer-uri: http://localhost:9080/auth/realms/baeldung-keycloak
  profiles:
    active: db, core, elastic, admin, wx
  messages:
    encoding: UTF-8
  servlet:
    context-path: /
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  cjdropship:
