spring:
  # spring.application.name is set in bootstrap.yml (litemall-goods-management)
  # so Eureka registration and gateway lb:// lookups stay consistent.
  main:
    allow-bean-definition-overriding: true
  cloud:
    loadbalancer:
      ribbon:
        enabled: true
    # stream:
    #   bindings:
    #     output:
    #       destination: your-topic-name
    #       content-type: application/json
  devtools:
    restart:
      enabled: true
      exclude: static/**,public/**,templates/**
      additional-exclude: META-INF/maven/**,META-INF/resources/**
    livereload:
      enabled: true
#      kafka:
#        binder:
#        brokers: localhost:9092
  # Keycloak OIDC/resource-server removed (Phase 4) — machine-JWT validation
  # is provided by litemall-svcsecurity (see top-level litemall.svcsecurity).
  profiles:
    # The legacy 'elastic' profile is gone now that Spring Data ES is removed;
    # OCS is the only search backend. Override via litemall-config per env.
    active: dev, db, core, admin, wx
  messages:
    encoding: UTF-8
  servlet:
    context-path: /
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  cjdropship:
    api:
      auth:
        cj-email: "bimeni89@gmail.com"
        cj-apiKey: "9520bc6b70fe45019688c5ae62be331b"
        access-url: "https://developers.cjdropshipping.com/api2.0/v1/authentication/getAccessToken"
        refresh-url: "https://developers.cjdropshipping.com/api2.0/v1/authentication/refreshAccessToken"
      category:
        category-list-_url: "https://developers.cjdropshipping.com/api2.0/v1/product/getCategory"
      product:
        list-url: "https://developers.cjdropshipping.com/api2.0/v1/product/list"
        product-detail-url: "https://developers.cjdropshipping.com/api2.0/v1/product"
#  datasource:
#    url: jdbc:mysql://localhost:3306/litemall
#    username: root
#    password: Calliste_1006
#    driver-class-name: com.mysql.cj.jdbc.Driver


  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


litemall:
  svcsecurity:
    # Phase 4: validate the machine JWT against litemall-authserver JWKS
    # (replaces Keycloak). Dev default; config-server overrides for non-dev.
    jwk-set-uri: http://localhost:8089/oauth2/jwks
  goods:
    # Stock threshold used by the goods-availability check before placing an
    # order. Overridable via the litemall-config repo per environment.
    stock-low-threshold: 5
  # OCS (Open Commerce Search) endpoints. Local-dev defaults below; for the
  # container profile (docker-compose), override to docker service names —
  # http://indexer:8535, http://searcher:8534, http://suggest:8081.
  search:
    indexer-url: http://localhost:8535
    search-url: http://localhost:8534
    suggest-url: http://localhost:8081
    index-name: litemall_index

server:
  port: 8082
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain


eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org:
      linlinjava:
        litemall:
          db: DEBUG
  config: classpath:logback-spring.xml

swagger:
  production: false

redis:
  server:
    host: localhost
    port: 6379
    database: 0
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      max-wait: -1ms
      min-idle: 0

