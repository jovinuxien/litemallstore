litemall:
  svcsecurity:
    # Phase 4: validate the machine JWT against litemall-authserver JWKS
    # (replaces Keycloak). Dev default; config-server overrides for non-dev.
    jwk-set-uri: http://localhost:8089/oauth2/jwks
    # Anonymous customer surface (litemall-wx-api parity): these /srv/** reads are
    # reachable with NO token so gateway-api can serve visitors. svcsecurity is
    # deny-by-default (publicPaths permitAll → adminPaths ROLE_ADMIN → else
    # authenticated), so the full customer set must be listed here explicitly.
    # /srv/private/admin/** stays ROLE_ADMIN (NOT listed).
    public-paths:
      - /actuator/health/**
      - /srv/authenticate/**
      - /srv/catalog/**
      - /srv/search/**
      - /srv/cjAuth/**
      - /srv/goods/**
      - /srv/brand/**
      - /srv/issue/**
      - /srv/comment/**
      - /srv/topic/**
      - /srv/home/**
      # Wave 4 anonymous surfaces (docs/handoff-content-endpoints.md). NOTE:
      # /srv/storage/upload is deliberately NOT public — fetch only.
      - /srv/region/**
      - /srv/storage/fetch/**
      - /srv/article/**
      - /srv/page/**
  goods:
    # Stock threshold used by the goods-availability check before placing an
    # order. Overridable via the litemall-config repo per environment.
    stock-low-threshold: 5
  # Storefront "about" metadata served anonymously at /srv/home/about (wx-api /home/about parity).
  # Config-driven (no litemall_system dependency); override per-env via config-server.
  mall:
    name: litemall
    address: ""
    phone: ""
    qq: ""
    longitude: ""
    latitude: ""
  # Object storage for the admin image/file uploads (/srv/private/admin/storage). Local disk by
  # default so the core StorageService bean resolves standalone; config-server / a cloud profile
  # can override active=aliyun|tencent|qiniu. 'address' is the public URL prefix for served files
  # (wire through the admin gateway as a follow-up).
  storage:
    active: local
    local:
      storage-path: /tmp/litemall/storage
      # Public fetch URL prefix minted into stored-object URLs. Wave 4: points at
      # the customer gateway's anonymous GET /srv/storage/fetch/{key} (the old
      # value referenced /srv/private/admin/storage/fetch, a route that never
      # existed — every previously minted URL was already dead, so no
      # back-compat route is kept).
      # NOTE: the value that actually WINS at runtime lives in
      # config/application-core.yml (litemall-core's application-core.yml is a
      # profile-specific file and would beat this base entry; our config/ copy
      # out-precedences core's). Keep both in sync.
      address: http://localhost:8090/srv/storage/fetch/
  # Customer upload caps (POST /srv/storage/upload — X-User-Id required).
  # Image-only, whitelist verified by magic bytes, not Content-Type.
  customer-storage:
    max-size-bytes: 5242880
  # OCS (Open Commerce Search) endpoints. Local-dev defaults below; for the
  # container profile (docker-compose), override to docker service names —
  # http://indexer:8535, http://searcher:8534, http://suggest:8081.
  search:
    indexer-url: http://localhost:8535
    search-url: http://localhost:8534
    suggest-url: http://localhost:8081
    index-name: litemall_index

server:
  port: 8082
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain


eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org:
      linlinjava:
        litemall:
          db: DEBUG
  config: classpath:logback-spring.xml

swagger:
  production: false

redis:
  server:
    host: localhost
    port: 6379
    database: 0
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      max-wait: -1ms
      min-idle: 0

