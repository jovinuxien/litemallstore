spring:
  # spring.application.name is set in bootstrap.yml (litemall-goods-management)
  # so Eureka registration and gateway lb:// lookups stay consistent.
  main:
    allow-bean-definition-overriding: true
  cloud:
    loadbalancer:
      ribbon:
        enabled: true
    # stream:
    #   bindings:
    #     output:
    #       destination: your-topic-name
    #       content-type: application/json
  devtools:
    restart:
      enabled: true
      exclude: static/**,public/**,templates/**
      additional-exclude: META-INF/maven/**,META-INF/resources/**
    livereload:
      enabled: true
#      kafka:
#        binder:
#        brokers: localhost:9092
  # Keycloak OIDC/resource-server removed (Phase 4) — machine-JWT validation
  # is provided by litemall-svcsecurity (see top-level litemall.svcsecurity).
  profiles:
    # The legacy 'elastic' profile is gone now that Spring Data ES is removed;
    # OCS is the only search backend. Override via litemall-config per env.
    active: dev, db, core, admin, wx
  messages:
    encoding: UTF-8
  servlet:
    context-path: /
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  cjdropship:
    api:
      auth:
        # Wave 7: env, no committed fallback. This was one of TWO different CJ
        # keys committed for the same account (the other, 8696a1…, lived in
        # litemall-core) — one variable now, set once in .env.
        cj-email: ${CJ_EMAIL:}
        cj-apiKey: ${CJ_API_KEY:}
        access-url: "https://developers.cjdropshipping.com/api2.0/v1/authentication/getAccessToken"
        refresh-url: "https://developers.cjdropshipping.com/api2.0/v1/authentication/refreshAccessToken"
      category:
        category-list-_url: "https://developers.cjdropshipping.com/api2.0/v1/product/getCategory"
      product:
        list-url: "https://developers.cjdropshipping.com/api2.0/v1/product/list"
        # CJ "Query Product" — single-product detail by ?pid=<uuid>. Profile/config-server overridable.
        product-detail-url: "https://developers.cjdropshipping.com/api2.0/v1/product/query"
        # CJ "Query Inventory By Variant" — per-variant warehouse stock by ?vid=<uuid>.
        stock-query-url: "https://developers.cjdropshipping.com/api2.0/v1/product/stock/queryByVid"
        # CJ "Product Comments" — per-product customer reviews by ?pid=<uuid> (paged).
        comments-url: "https://developers.cjdropshipping.com/api2.0/v1/product/productComments"
        # CJ "Product Sourcing" — create a sourcing request / query its status (POST, JSON body).
        sourcing-create-url: "https://developers.cjdropshipping.com/api2.0/v1/product/sourcing/create"
        sourcing-query-url: "https://developers.cjdropshipping.com/api2.0/v1/product/sourcing/query"
        # CJ "Product Video" — per-product videos (POST, JSON body {productId}).
        product-videos-url: "https://developers.cjdropshipping.com/api2.0/v1/product/queryVideosByProductId"
      # CJ "Storage info" — warehouse detail by ?id=<storageId>. NOTE: this endpoint's response
      # envelope is {code:200, result:true, ...}, unlike the product API's {success, code:0, ...}.
      warehouse:
        detail-url: "https://developers.cjdropshipping.com/api2.0/v1/warehouse/detail"
      # ORDER PLACEMENT is implemented in litemall-order (the order worktree), NOT here.
      # The create-order URL belongs with that ACL; left here only as a documented pointer:
      # order:
      #   create-url: "https://developers.cjdropshipping.com/api2.0/v1/shopping/order/createOrder"
    # --- CJ → OCS indexing ---
    enabled: true
    # Retail = CJ wholesale cost (USD) × margin (NOT raw wholesale cost). Wave 12 (user decision
    # 2026-07-28): margin 1.25, and the old usd-to-cny 7.2 currency factor is DELETED — prices
    # live in the USD basis and the raw cost is persisted (litemall_cj_product.sell_price,
    # litemall_goods[_product].cost). Tune per business; profile-overridable.
    pricing:
      margin: 1.25
    # Stock assumed for a CJ SKU until real inventory is fetched (keeps in-stock scoring from burying CJ).
    default-stock: 100
    # Recorded CJ product-list response, used only when the live CJ API is unreachable.
    sample-path: "sample-cj-products.json"
    # Redis staging buffer for raw CJ /product/list payloads (fetch → Redis → DB → OCS). The fetch
    # lands raw responses here (survives restart, avoids re-hitting the 1-req/300s CJ API); the
    # snapshot sync reads them back to normalize + persist into litemall_cj_product.
    redis:
      raw-ttl-seconds: 21600   # 6h
    # Nightly cron (sec min hour dom mon dow) for the CJ catalog indexing job. 03:00 daily.
    refresh-cron: "0 0 3 * * *"
    # Seconds the job blocks between consecutive CJ /product/list calls, so a multi-category plan
    # stays rate-limited even though one run issues several requests. CJ's product/list contract
    # allows 1 req/s; 3s is a conservative cruise pace that still sweeps all ~540 mirrored leaves
    # in under 30 min (Redis-staged pages are reused without any live call).
    fetch-pace-seconds: 3
    # Wave 26: attempts per list page. CJ QPS-rejects ~17% of calls even at a 3s pace and the
    # old break-on-first-failure silently truncated a leaf to zero products.
    fetch-retries: ${LITEMALL_CJ_FETCH_RETRIES:3}
    # CJ /product/list page size (CJ caps at ~200).
    page-size: 200
    # Products enriched per nightly run. Sized against the MEASURED CJ points budget (2026-08-15):
    # ~280 points/product (1 detail + 4.6 variant-inventory calls), a ~69k daily budget that CJ
    # scales with ORDER volume rather than catalogue size, and ~3.4k/night for the anchor-only
    # sync. 200 x 280 = ~56k with headroom for order placement, which draws on the SAME budget.
    # 400 would need ~112k — 1.6x the whole day; the day it was tried, the budget ran out.
    # ⚠ CJ daily API points are shared ACCOUNT-WIDE with ORDER PLACEMENT (same CJ account, a
    # different key pair). enrichBatch aborts itself on quota exhaustion or 5 consecutive
    # failures, so a raised batch cannot keep draining the budget paid orders need — but if
    # placements ever start parking on CJ errors, THIS is the first knob to turn back down.
    # Env-backed so that is a container recreate, not a rebuild; 0 disables enrichment entirely.
    enrich-batch-size: ${LITEMALL_CJ_ENRICH_BATCH_SIZE:200}
    # Run a one-shot CJ refresh shortly after startup (besides the nightly cron) so a fresh
    # deploy/restart repopulates the CJ catalog without waiting for 03:00 or an authed reindex.
    refresh-on-startup: true
    refresh-startup-delay-ms: 600000   # 10 min after the app is ready
    # Category fetch plan: which CJ categories to index and how many products from each.
    # `category` = a CJ category name (any level), resolved to leaf category ids via getCategory;
    # or set `category-id` to a CJ leaf UUID directly. `limit` caps products indexed per target.
    # `per-leaf-limit` > 0 gives EVERY resolved leaf its own budget (fills all subcategories of a
    # broad target); `limit` then only caps the overall haul. Cost note: per-leaf mode issues ~1
    # paced call per leaf; legacy mode ~ceil(limit/page-size) calls per target.
    # NIGHTLY-PRUNE INVARIANT: the nightly cron runs THIS plan with stale-prune — every category
    # the storefront should keep must stay covered here, or its products age out at 03:00.
    # Wave 26: which day runs the FULL plan (every target, WITH stale-prune + native reconcile).
    # On the other six days only `nightly: true` targets are swept, additively.
    # Blank/typo ⇒ every day is a full run, i.e. the pre-Wave-26 behaviour.
    full-sync-day: ${LITEMALL_CJ_FULL_SYNC_DAY:SUNDAY}
    catalog-targets:
      # ⚠ Wave 26 — `nightly: false` on the NON-ANCHOR targets. CJ's daily API points are a hard
      # shared budget (~69k, and CJ scales it with ORDER volume, not catalogue size). Measured
      # 2026-08-15: sweeping all ~540 leaves costs ~27k of it — 40% of the day — to mirror
      # categories the storefront no longer sells, while enrichment AND order placement draw on
      # the same budget and the day ran out mid-afternoon. These still refresh every SUNDAY, so
      # the mirror stays current enough to take a category back (pipeline broad, storefront
      # narrow); only the daily cost goes away.
      # legacy deep targets — keep their flagship leaves richer than the light fill
      - { category: "Toys, Kids & Babies", limit: 200, nightly: false }   # baby
      - { category: "Women's Clothing",    limit: 300, nightly: false }   # women
      - { category: "Consumer Electronics", limit: 200, nightly: false }  # electronics
      # Wave 14 light fill sized for the ~12k catalog target: every leaf of every CJ L1
      # tree gets its own ~25-product budget. `limit: 0` is EXPLICIT and means uncapped
      # in per-leaf mode (the Java default of 200 silently capped each target — the
      # Wave-14 inflow-ceiling gotcha); per-leaf-limit is the real control. ~540 leaves
      # x 25 ≈ 13.5k raw minus duplicate-category overlap → sustains ~12,000 on-sale.
      # 25 < page-size, so this is still exactly 1 paced call per leaf.
      - { category: "Women's Clothing",           per-leaf-limit: 25, limit: 0, nightly: false }
      - { category: "Toys, Kids & Babies",        per-leaf-limit: 25, limit: 0, nightly: false }
      - { category: "Consumer Electronics",       per-leaf-limit: 25, limit: 0, nightly: false }
      - { category: "Pet Supplies",               per-leaf-limit: 25, limit: 0, nightly: false }
      - { category: "Men's Clothing",             per-leaf-limit: 25, limit: 0, nightly: false }
      - { category: "Home, Garden & Furniture",   per-leaf-limit: 25, limit: 0 }
      - { category: "Health, Beauty & Hair",      per-leaf-limit: 25, limit: 0, nightly: false }
      - { category: "Sports & Outdoors",          per-leaf-limit: 25, limit: 0, nightly: false }
      - { category: "Automobiles & Motorcycles",  per-leaf-limit: 25, limit: 0, nightly: false }
      - { category: "Jewelry & Watches",          per-leaf-limit: 25, limit: 0, nightly: false }
      - { category: "Phones & Accessories",       per-leaf-limit: 25, limit: 0, nightly: false }
      - { category: "Computer & Office",          per-leaf-limit: 25, limit: 0, nightly: false }
      - { category: "Bags & Shoes",               per-leaf-limit: 25, limit: 0, nightly: false }
      - { category: "Home Improvement",           per-leaf-limit: 25, limit: 0 }
      # ---- Wave 26: DE-WAREHOUSE SOURCING (measured 2026-08-15) -------------------------
      # These acquire German-warehoused stock in our price band. They are NOT a filter on the
      # existing catalogue: Phase 1a measured DE at 0.30% of CJ supply storewide, so filtering
      # what we already mirror would leave ~40 products. Acquisition is the only route.
      #
      # ⚠ minPrice/maxPrice bound CJ COST IN USD. Our €25–80 RETAIL band at margin 2.5 is
      # €10–32 of cost, and at fx 0.866 that is $11.55–$36.95. Do not "fix" these to euros.
      #
      # Leaves, not L1s, and only ones with measured DE stock: DE is a property of a few hundred
      # individual SKUs, and 12 leaves hold 308 of the 315 found. Sweeping a whole L1 for DE
      # spends points on leaves that have none. Counts below are CJ SUPPLY at probe time
      # (docs/wave26-de-sourcing-probe-2026-08-15.md) — what we could acquire, not what we hold.
      # ~1 paced call per leaf per night, ~600 points total.
      #
      # ⚠ SEASONAL: Christmas Decoration and Event & Party are two of the top three, measured in
      # August. Expect their DE stock to move with the season, not to be a permanent supply.
      - { category-id: "7B975B46-46DF-4C3A-BC58-1F4F2DDB9413", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Decorative Flowers & Wreaths (78 DE)
      - { category-id: "C329460A-9074-4E42-B1FD-D9E91568A64B", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Event & Party Supplies (49)
      - { category-id: "B62EE40F-7650-4715-A7A5-BA227540593C", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Bathroom Storage (48)
      - { category-id: "56845C3D-4D9E-4729-B5D4-6D7DE310C031", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Kitchen Storage (38)
      - { category-id: "621F9C38-814C-40C2-9F9D-7CE12DB8FB4C", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Christmas Decoration Supplies (25, seasonal)
      - { category-id: "9FC79C6B-AE70-472C-B8F8-D62479F0D03E", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Power Tools (17)
      - { category-id: "1A9A9965-A914-46D7-B8E2-49AD256F2B6B", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Curtains (15)
      - { category-id: "FD2629CD-9379-4EC4-BCF3-5998AEA3E642", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Fabric (13)
      - { category-id: "93671B1A-DE8F-4398-B139-8B2214206648", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Apparel Sewing & Fabric (8)
      - { category-id: "7E431502-1275-4FF3-A236-B97C107C3AFA", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Flashlights & Torches (7)
      - { category-id: "300CC260-CF9D-4AEA-9FC2-6C8DB8A35B51", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Cushion Covers (5)
      - { category-id: "36C55794-4437-4782-B8CF-D265C12CA4E5", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Downlights (5)
      # Home Improvement, measured 2026-08-15 16:00 UTC (28 leaves, 423 DE of 6,354 in-band =
      # 6.66% — denser than Home, Garden & Furniture's 5.05%, as Phase 1a predicted at 5.18%).
      # Hand Tools alone is 277 DE of 632 in-band (44%), the largest pocket found anywhere.
      - { category-id: "55795653-09E8-4EE6-B477-1E30E7A601B2", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Hand Tools (277 DE)
      - { category-id: "CDB10A90-3D34-4396-99B2-919E7CAD4B53", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Garden Tools (51)
      - { category-id: "7B18EF9A-B48E-4917-84AF-624919C32CA6", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Tool Sets (26)
      - { category-id: "AC4A8F93-27FF-4531-8394-53E97F02159D", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Wall Lamps (12)
      - { category-id: "A028998B-C8CF-4533-BBE4-E04FA244CDC6", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Kitchen Appliances (9)
      - { category-id: "924090C3-8179-437F-8219-37582113FB08", limit: 200, country-code: DE, min-price: 11.55, max-price: 36.95 }  # Tools Storage (6)
      # Both anchor L1s are now fully swept (68 of 68 leaves). Leaves with <5 DE products are
      # deliberately left out: a target costs a paced call every night for a handful of SKUs.
    # CJ category → local litemall category id, as "Name=<localId>" entries (a LIST, not a map:
    # Spring mangles map keys containing spaces). Matched case-insensitively against ANY segment of
    # the CJ category path — and checked BEFORE the mirrored-tree resolution, so a matching entry
    # DIVERTS products away from their real CJ subcategory into a native bucket. RETIRED (empty)
    # now that the full CJ tree is mirrored into litemall_category and the storefront browses the
    # real root→leaf chains; re-add entries only to deliberately pin a CJ path onto a native id.
    category-mapping: []
#  datasource:
#    url: jdbc:mysql://localhost:3306/litemall
#    username: root
#    password: ${MYSQL_PASSWORD:}   # Wave 7: never commit a real password, even commented out
#    driver-class-name: com.mysql.cj.jdbc.Driver


  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


litemall:
  svcsecurity:
    # Phase 4: validate the machine JWT against litemall-authserver JWKS
    # (replaces Keycloak). Dev default; config-server overrides for non-dev.
    jwk-set-uri: http://localhost:8089/oauth2/jwks
    # Anonymous customer surface (litemall-wx-api parity): these /srv/** reads are
    # reachable with NO token so gateway-api can serve visitors. svcsecurity is
    # deny-by-default (publicPaths permitAll → adminPaths ROLE_ADMIN → else
    # authenticated), so the full customer set must be listed here explicitly.
    # /srv/private/admin/** stays ROLE_ADMIN (NOT listed).
    public-paths:
      - /actuator/health/**
      - /srv/authenticate/**
      - /srv/catalog/**
      - /srv/search/**
      - /srv/cjAuth/**
      - /srv/goods/**
      - /srv/brand/**
      - /srv/issue/**
      - /srv/comment/**
      - /srv/topic/**
      - /srv/home/**
      # Wave 4 anonymous surfaces (docs/handoff-content-endpoints.md). NOTE:
      # /srv/storage/upload is deliberately NOT public — fetch only.
      - /srv/region/**
      - /srv/storage/fetch/**
      - /srv/article/**
      - /srv/page/**
      # Behavioral targeting Phase 0 (doc/behavioral-events.md): anonymous batch
      # ingest — the edge exposes it POST-only; identity/consent proof is the
      # edge-injected X-Visitor-Id, batches without it are dropped.
      - /srv/track/**
  # Wave 13 (SEO): absolute origin minted into sitemap <loc> URLs. The default is the
  # live storefront, so prod needs no env; override for other environments.
  public-base-url: ${LITEMALL_PUBLIC_BASE_URL:https://trovemo.com}
  goods:
    # Stock threshold used by the goods-availability check before placing an
    # order. Overridable via the litemall-config repo per environment.
    stock-low-threshold: 5
    # Wave 26 Phase 2: minimum retail to stay on sale. 0 = OFF (default). A sub-floor good is
    # OFF-SALED (reversible), never silently repriced — retail must stay cost x margin or the
    # margin guard, deal floors and coupon guard all compute against a lie.
    price-floor: ${LITEMALL_GOODS_PRICE_FLOOR:0}
    # Maximum retail to stay on sale. 0 = OFF (default). Mirror of the floor, same off-sale
    # semantics. Guards the OTHER end: outlier CJ costs produce listings like a EUR 32,819
    # sideboard, which on a young merchant account reads as a pricing fault and risks an
    # account-level misrepresentation review rather than a single-item rejection.
    # Suggested prod value: 500 (97 live rows above it on 2026-08-26).
    price-ceiling: ${LITEMALL_GOODS_PRICE_CEILING:0}
    # Wave 26 Phase 2: L1 root category ids the storefront is narrowed to. EMPTY = OFF (default).
    # Narrowing off-sales the goods that exist today, but the CJ pipeline keeps mirroring all 14
    # L1s and the nightly promote lands every NEW product on sale — measured on prod one night
    # after narrowing: 428 new on-sale goods, 328 outside the anchor. Without this the storefront
    # drifts back to broad within weeks. Applies to NEW goods only, so /insight/narrow/restore
    # still works. Comma-separated, e.g. "1036143,1036495".
    anchor-category-ids: ${LITEMALL_GOODS_ANCHOR_CATEGORY_IDS:}
    # Display/JSON-LD currency served by /srv/goods/meta (Wave 13) — uppercase ISO,
    # mirroring the order service's LITEMALL_ORDER_STRIPE_CURRENCY (usd).
    currency: ${LITEMALL_GOODS_CURRENCY:USD}
    # Wave 24: USD→EUR factor applied to raw CJ amounts at cost landing (CjPricing
    # intake — sync, enrichment, on-demand detail), BEFORE margin markup, so stored
    # cost/retail persist in the store currency. 1.0 = identity; prod sets the real
    # rate at the EUR flip together with LITEMALL_GOODS_CURRENCY=EUR.
    fx-usd-eur: ${LITEMALL_FX_USD_EUR:1.0}
  # Wave 14: inventory governance. The governor sizes nightly retirement proposals
  # against catalog-target; the 02:00 executor flips due APPROVED batches off-sale
  # (reversible via the normal admin on-sale toggle). Crons stay clear of the nightly
  # chain: 02:00 retire < 02:45 related-goods < 03:00 sync < 03:30 enrich < 04:15
  # recheck < 05:00 auto deals.
  inventoryflow:
    catalog-target: ${LITEMALL_CATALOG_TARGET:12000}
    retire-cron: "0 0 2 * * *"
    retire-default-day: ${LITEMALL_RETIRE_DEFAULT_DAY:WEDNESDAY}
  deals:
    # Wave 14 (user decision 2026-07-29, supersedes Wave-12 manual-only): auto top-N
    # daily deals from hot-tier proposals. Floor = max(suggestedDealPrice, cost x 1.05)
    # — an auto deal can never sell at a loss. Env kill-switch, no rebuild needed.
    auto-daily-enabled: ${LITEMALL_DEALS_AUTO_DAILY_ENABLED:true}
    auto-daily-cap: ${LITEMALL_DEALS_AUTO_DAILY_CAP:12}
    auto-daily-window-hours: ${LITEMALL_DEALS_AUTO_DAILY_WINDOW_HOURS:24}
    auto-daily-cron: "0 0 5 * * *"
  # Behavioral targeting Phase 0 (doc/behavioral-events.md): first-party event
  # ingest at POST /srv/track/collect. Fire-and-forget — bounded in-memory queue
  # (drops with a WARN when full), batch-drained every drain-ms. Env kill-switch;
  # disabling needs only a container recreate, no rebuild.
  tracking:
    enabled: ${LITEMALL_TRACKING_ENABLED:true}
    queue-capacity: ${LITEMALL_TRACKING_QUEUE_CAPACITY:20000}
    insert-batch: ${LITEMALL_TRACKING_INSERT_BATCH:200}
    drain-ms: ${LITEMALL_TRACKING_DRAIN_MS:2000}
  # Wave 22 search demand analytics: nightly rollup of litemall_search_history +
  # the Phase-0 behavioral log (search / click_result events, aggregate-only) into
  # litemall_search_stat_daily, then the trending refresh (demand-derived hot
  # keywords — additive; admin-curated litemall_keyword rows are never deleted or
  # unhotted). 04:45 = after the 04:30 promo scorer, before the 05:00 auto-deal
  # tick. Env kill-switch; disabling needs only a container recreate, no rebuild.
  search-stats:
    enabled: ${LITEMALL_SEARCHSTATS_ENABLED:true}
    cron: "0 45 4 * * *"
    rollup-days: ${LITEMALL_SEARCHSTATS_ROLLUP_DAYS:2}
    trending-top: ${LITEMALL_SEARCHSTATS_TRENDING_TOP:8}
    trending-window-days: ${LITEMALL_SEARCHSTATS_TRENDING_WINDOW_DAYS:7}
    trending-min-searches: ${LITEMALL_SEARCHSTATS_TRENDING_MIN_SEARCHES:3}
  # Storefront "about" metadata served anonymously at /srv/home/about (wx-api /home/about parity).
  # Config-driven (no litemall_system dependency); override per-env via config-server.
  mall:
    name: litemall
    address: ""
    phone: ""
    qq: ""
    longitude: ""
    latitude: ""
  # Object storage for the admin image/file uploads (/srv/private/admin/storage). Local disk by
  # default so the core StorageService bean resolves standalone; config-server / a cloud profile
  # can override active=aliyun|tencent|qiniu. 'address' is the public URL prefix for served files
  # (wire through the admin gateway as a follow-up).
  storage:
    active: local
    local:
      storage-path: /tmp/litemall/storage
      # Public fetch URL prefix minted into stored-object URLs. Wave 4: points at
      # the customer gateway's anonymous GET /srv/storage/fetch/{key} (the old
      # value referenced /srv/private/admin/storage/fetch, a route that never
      # existed — every previously minted URL was already dead, so no
      # back-compat route is kept).
      # NOTE: the value that actually WINS at runtime lives in
      # config/application-core.yml (litemall-core's application-core.yml is a
      # profile-specific file and would beat this base entry; our config/ copy
      # out-precedences core's). Keep both in sync.
      address: http://localhost:8090/srv/storage/fetch/
  # Customer upload caps (POST /srv/storage/upload — X-User-Id required).
  # Image-only, whitelist verified by magic bytes, not Content-Type.
  customer-storage:
    max-size-bytes: 5242880
  # OCS (Open Commerce Search) endpoints. Local-dev defaults below; for the
  # container profile (docker-compose), override to docker service names —
  # http://indexer:8535, http://searcher:8534, http://suggest:8081.
  search:
    indexer-url: http://localhost:8535
    search-url: http://localhost:8534
    suggest-url: http://localhost:8081
    index-name: litemall_index

  # Keyword-demand facts from seo_plateform, read through the ACL in
  # infrastructure/acl/seo. OFF by default and the default matters: the platform
  # buys this data from a pay-as-you-go provider, so switching it on is what
  # starts spending. A configured URL with the switch off costs nothing.
  #
  # location-code 2276 is Germany — where the store actually fulfils from (CJ's
  # only EU warehouse) — while language-code stays 'en' because the catalogue is
  # English. The platform's own default is 2840 (United States) and would buy
  # plausible data for a market this store does not serve.
  seo-research:
    # file (default) = read an export already paid for; platform = buy live;
    # none = off. All three sit behind the same port, so callers never change.
    source: ${LITEMALL_SEO_RESEARCH_SOURCE:file}
    # The CLEANED export. The raw one keeps permutation groups, which would make
    # one keyword look like six. In a container this must be a MOUNTED path —
    # see docker-compose.prod.yml.
    file: ${LITEMALL_SEO_RESEARCH_FILE:${user.home}/trovemo-seo-export/category-keywords-clean.csv}
    enabled: ${LITEMALL_SEO_RESEARCH_ENABLED:false}
    base-url: ${LITEMALL_SEO_RESEARCH_BASE_URL:http://localhost:9000}
    token-uri: ${LITEMALL_SEO_RESEARCH_TOKEN_URI:http://localhost:8090/realms/seo/protocol/openid-connect/token}
    client-id: ${LITEMALL_SEO_RESEARCH_CLIENT_ID:litemall-goods}
    client-secret: ${LITEMALL_SEO_RESEARCH_CLIENT_SECRET:}
    location-code: ${LITEMALL_SEO_RESEARCH_LOCATION:2276}
    language-code: ${LITEMALL_SEO_RESEARCH_LANGUAGE:en}
    limit: 100

server:
  port: 8082
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain


eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org:
      linlinjava:
        litemall:
          db: DEBUG
  config: classpath:logback-spring.xml

swagger:
  production: false

redis:
  server:
    host: localhost
    port: 6379
    database: 0
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      max-wait: -1ms
      min-idle: 0

