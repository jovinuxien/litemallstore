server:
  port: 8089

# This server holds no persistent state — registered clients are in-memory and
# the signing key is PEM/ephemeral. It depends on litemall-db only for the
# shared JwtProperties/RsaKeys types, which transitively drags in Druid + JDBC +
# Flyway. Disable those datastore auto-configurations so the app starts without
# a database (otherwise: "Failed to determine a suitable driver class").
spring:
  autoconfigure:
    exclude:
      - com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Machine-token realm. Distinct issuer from the customer/admin EDGE realms:
# this signs service-to-service client_credentials tokens only. RS256; the
# public key is published at /oauth2/jwks for the resource servers.
# Leave the PEM blank in dev -> ephemeral key (restart invalidates issued
# machine tokens). Supply litemall.jwt.private-key-pem / public-key-pem
# (or via litemall-config) for a stable key.
litemall:
  jwt:
    issuer: litemall-authserver
    audience: litemall-services
    access-ttl-seconds: 600
    # Wave 7: these were EMPTY, so RsaKeys.from() generated an ephemeral pair
    # on every boot — this service signs every machine token and serves the
    # JWKS both gateways verify against. JwtKeyGuard now fails prod startup.
    private-key-pem: ${LITEMALL_JWT_PRIVATE_KEY_PEM:}
    public-key-pem: ${LITEMALL_JWT_PUBLIC_KEY_PEM:}
  authserver:
    # Dev plaintext client_credentials secrets (NoOpPasswordEncoder).
    # Override via config-server / env for non-dev.
    # Wave 7: env, no committed fallback. These are plaintext by design
    # (NoOpPasswordEncoder) — a committed value is a usable credential for
    # anyone with repo access. JwtKeyGuard fails startup in prod if unset.
    gateway-admin-secret: ${LITEMALL_AUTHSERVER_GATEWAY_ADMIN_SECRET:}
    gateway-api-secret: ${LITEMALL_AUTHSERVER_GATEWAY_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
