spring:
  application:
    name: litemall-authserver
  profiles:
    active: default
  cloud:
    config:
      uri: http://configserver:8888
    bootstrap:
      enabled: true
    compatibility-verifier:
      enabled: false

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
