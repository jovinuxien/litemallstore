spring:
  application:
    name: GOODS-SERVICE-APP
  cloud:
    loadbalancer:
      ribbon:
        enabled: true
    stream:
      bindings:
        output:
          destination: your-topic-name
          content-type: application/json
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
#      kafka:
#        binder:
#        brokers: localhost:9092
  integration:
    file:
      auto-create-directories: true
      lock:
        expire: 60000 # 1 minute lock expiry
  # Keycloak OIDC/resource-server removed (Phase 4) — machine-JWT validation
  # is provided by litemall-svcsecurity (see top-level litemall.svcsecurity).
  profiles:
    active: db, core, elastic, admin, wx
  messages:
    encoding: UTF-8
  servlet:
    context-path: /
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  cjdropship:
    api:
      auth:
        cj-email: "bimeni89@gmail.com"
        # Wave 7: env, no committed fallback.
        cj-apiKey: ${CJ_API_KEY:}
        access-url: "https://developers.cjdropshipping.com/api2.0/v1/authentication/getAccessToken"
        refresh-url: "https://developers.cjdropshipping.com/api2.0/v1/authentication/refreshAccessToken"
      category:
        category-list-_url: "https://developers.cjdropshipping.com/api2.0/v1/product/getCategory"
      product:
        list-url: "https://developers.cjdropshipping.com/api2.0/v1/product/list"
        product-detail-url: "https://developers.cjdropshipping.com/api2.0/v1/product"

  task:
    scheduling:
      enabled=true:

#  datasource:
#    url: jdbc:mysql://localhost:3306/litemall
#    username: root
#    password: ${MYSQL_PASSWORD:}   # Wave 7: never commit a real password, even commented out
#    driver-class-name: com.mysql.cj.jdbc.Driver


data:
  fetch:
   cron: 0 */10 * * * *

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

initial:
  data:
    file: /data/cj-products/initial-products.json
file:
  polling:
    directory: /data/cj-products

cache:
  directory: /data/product-cache
output:
  file:
    path: /data/cj-products/merged-products.json

litemall:
  svcsecurity:
    # Phase 4: validate the machine JWT against litemall-authserver JWKS
    # (replaces Keycloak). Dev default; config-server overrides for non-dev.
    jwk-set-uri: http://localhost:8089/oauth2/jwks

server:
  port: 8083
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain


eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.integration: DEBUG
    org.linlinjava.litemall: TrACE
    org.linlinjava.litemall.db: DEBUG

  config: classpath:logback-spring.xml

swagger:
  production: false

redis:
  server:
    host: localhost
    port: 6379
    database: 0
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      max-wait: -1ms
      min-idle: 0

