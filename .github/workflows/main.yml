# litemall CI — Wave-7 `platform` Task D.
#
# The previous workflow built on JDK 8/11 (the reactor needs 21, so the Java job
# could not have passed) and npm-tested `litemall-admin` and `litemall-vue`,
# BOTH DELETED IN WAVE 4. Nothing had been verified automatically in months —
# which is exactly how four independent clean-checkout build failures accumulated
# unnoticed (see the Wave-7 plan and docs/handoff-secrets-wave7.md).
#
# Everything here builds from a CLEAN CHECKOUT, which is the property that was
# missing: every service is normally built with `-pl <module> -am`, which never
# walks the whole dependency graph.

name: CI

on:
  push:
  pull_request:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Java reactor + tests. Single JDK: the root pom pins <java.version>21</java.version>,
  # so a matrix over 8/11/17 would only ever produce noise.
  # ---------------------------------------------------------------------------
  build:
    name: Build + test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Two passes for npm, mirroring docker/Dockerfile — see that file for the
      # full reasoning. Short version: no single flag skips ONLY goods-management's
      # broken `vite build` (vite is in no dependency list; its package.json is
      # JHipster scaffolding), and -Dskip.npm=true would also skip the two REAL
      # SPAs, shipping gateways with no UI.
      #
      # Step 1 compiles ALL production code for every module — the check that was
      # missing while nothing built from a clean checkout.
      # -DskipTests as well as -Dmaven.test.skip: frontend-maven-plugin honours
      # skipTests (not maven.test.skip) for executions bound to the `test` phase,
      # and gateway-admin has one there (npm run webapp:test). Without it that
      # jest suite runs inside what is meant to be a compile-only step.
      - name: Compile all modules (no tests, no npm)
        run: >
          mvn -B --no-transfer-progress
          -Dmaven.test.skip=true -DskipTests
          -Dskip.npm=true -Dskip.installnodenpm=true
          install

      # Step 2 actually RUNS the tests — the point of Task D. The root pom no
      # longer sets maven.test.skip=true, so they compile and execute.
      #
      # `-pl '!litemall-order'` is a KNOWN, TEMPORARY exclusion, not a default:
      # litemall-order's test tree does not compile (tests reference a
      # PostgreSqlTestContainer — a JHipster relic; this project is MySQL — and
      # constructors that production code has since changed). That module belongs
      # to the `order` worktree; the fix is theirs, and it is written up in
      # docs/handoff-secrets-wave7.md. Excluding it loudly here beats the status
      # quo, which was skipping tests for the ENTIRE reactor silently.
      #
      # DELETE THIS EXCLUSION once order's tests compile.
      #
      # DB-backed tests self-skip via Assume when MYSQL_PASSWORD is unset, so this
      # is green without a database while still compiling every test source.
      - name: Run tests (all modules except litemall-order — see comment)
        run: >
          mvn -B --no-transfer-progress
          -Dskip.npm=true -Dskip.installnodenpm=true
          -pl '!litemall-order'
          test

      # `clean` is REQUIRED, not tidiness: gateway-admin gates its npm goals on a
      # folder checksum written by the pass above. Without clean, npm is SKIPPED
      # and the admin jar ships with no UI — silently, with a green build.
      - name: Build both SPAs into the gateway jars
        run: >
          mvn -B --no-transfer-progress -DskipTests
          clean package
          -pl litemall-gateway-api,litemall-gateway-admin

      # The SPA build failing open is this repo's classic silent failure: a jar
      # that starts fine and serves a blank page. Assert it, don't hope.
      - name: Assert both gateway jars actually contain their SPA
        run: |
          set -eu
          for j in litemall-gateway-api/target/litemall-gateway-api-*.jar \
                   litemall-gateway-admin/target/litemall-gateway-admin-*.jar; do
            if ! jar tf "$j" | grep -qE 'BOOT-INF/classes/static/.+\.(js|html)'; then
              echo "::error::$j contains no built SPA (BOOT-INF/classes/static)."
              exit 1
            fi
            echo "OK: SPA present in $j"
          done

  # ---------------------------------------------------------------------------
  # Deploy artifacts — proves the thing we actually ship still builds.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image + compose + TLS config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # One representative service: gateway-api exercises the shared reactor
      # builder AND the SPA assertion. Building all 9 targets would re-run the
      # same builder stage for no extra signal.
      - name: Build gateway-api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: litemall-gateway-api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate prod compose renders
        env:
          # Dummy values: `config` only resolves interpolation and connects to
          # nothing. This asserts the file is structurally valid and that every
          # ${VAR:?} is actually declared — catching a variable added to compose
          # but forgotten in .env.prod.example.
          SHOP_DOMAIN: localhost
          ADMIN_DOMAIN: localhost:8443
          SHOP_ORIGIN: https://shop.example.com
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_USER: litemall
          MYSQL_PASSWORD: ci
          RABBITMQ_USER: ci
          RABBITMQ_PASSWORD: ci
          AUTHSERVER_JWT_PRIVATE_KEY_PEM: ci
          AUTHSERVER_JWT_PUBLIC_KEY_PEM: ci
          GATEWAY_API_JWT_PRIVATE_KEY_PEM: ci
          GATEWAY_API_JWT_PUBLIC_KEY_PEM: ci
          GATEWAY_ADMIN_JWT_PRIVATE_KEY_PEM: ci
          GATEWAY_ADMIN_JWT_PUBLIC_KEY_PEM: ci
          GATEWAY_API_CLIENT_SECRET: ci
          GATEWAY_ADMIN_CLIENT_SECRET: ci
        run: docker compose -f docker-compose/docker-compose.prod.yml config >/dev/null

      - name: Validate Caddyfile (TLS ingress)
        env:
          SHOP_DOMAIN: localhost
          ADMIN_DOMAIN: localhost:8443
          ACME_EMAIL: ops@example.com
        run: |
          docker run --rm \
            -e SHOP_DOMAIN -e ADMIN_DOMAIN -e ACME_EMAIL \
            -v "$PWD/docker-compose/Caddyfile":/etc/caddy/Caddyfile:ro \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # ---------------------------------------------------------------------------
  # Secret scanning — so the Wave-7 secret cleanup cannot silently regress.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret added and then "removed" in a later commit is
          # still a leak, and a shallow clone cannot see it.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
