# litemall — production stack (single VPS).
#
#   docker compose -f docker-compose/docker-compose.prod.yml --env-file .env up -d
#
# Wave-7 `platform` Task A. This is the FIRST artifact that deploys the real
# 10-service architecture; everything that came before it (docker/litemall,
# deploy/, docker-compose-recover.yml) packaged the deprecated monolith.
#
# ---------------------------------------------------------------------------
# SECRETS: every credential below is ${VAR:?} — no committed fallback, and the
# `:?` form makes compose ABORT with a named variable rather than start a
# service with an empty password. Copy .env.prod.example -> .env and fill it in.
# .env is gitignored.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# ⚠ replicas: 1 IS LOAD-BEARING — DO NOT SCALE ANY litemall SERVICE. ⚠
#
# 14 @Scheduled jobs across order / goods-management / promotion / analytic have
# NO ShedLock and NO leader election. A second replica runs every one of them a
# second time, concurrently:
#   order:      MailOutboxSweepScheduler      -> duplicate customer emails
#               CjOrderStatusSyncScheduler    -> 2x the CJ external API budget
#               OrderEventOutboxRelay         -> duplicate domain events
#               BrokerageUnfreezeScheduler    -> double commission unfreeze
#               AutoConfirmOrderScheduler / UnpaidOrderTaskScheduler
#   promotion:  SocialDealAutoPoster          -> double-posts to Meta + TikTok
#               PromotionExpirySweeper
#   goods:      CjCatalogRefreshTask (x2), FlashDealLifecycleTask,
#               RelatedGoodsRefreshTask
#   analytic:   ProductCacheReaderService, CJProductService, CacheFileDataProcessingConfig
#
# Scaling out is silent — nothing errors, you just pay the CJ API twice and mail
# your customers twice. ShedLock is the prerequisite for >1 replica and is
# recorded in the Wave-7 debt register
# (doc/production-readiness-plan-2026-07-16.md).
# ---------------------------------------------------------------------------

name: litemall-prod

# ---------------------------------------------------------------------------
# YAML anchors — shared shape for the ten Spring services.
# ---------------------------------------------------------------------------
x-litemall-build: &litemall-build
  context: ..
  dockerfile: docker/Dockerfile

x-litemall-common: &litemall-common
  restart: unless-stopped
  deploy:
    # Declares the intent and is the default. NOTE it is not a hard gate:
    # `docker compose up --scale order=2` still overrides it. The banner above
    # is the real control — there is no technical enforcement until ShedLock
    # lands, which is exactly why the trap is worth reading.
    replicas: 1
  networks: [litemall]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Wiring every service needs: discovery, config server, machine-token issuer.
# These live in bootstrap.yml (legacy bootstrap context), which application-prod.yml
# CANNOT override — the bootstrap context is built before profile YAML loads.
# Environment variables outrank both, so this is the only correct seam for them.
x-litemall-discovery: &litemall-discovery
  # Config CLIENT is OFF, deliberately. The comment above ("Environment variables
  # outrank both") is not true against a config server: Spring Cloud Config's
  # remote property sources outrank env by default
  # (spring.cloud.config.overrideSystemProperties defaults true).
  #
  # It bit exactly that way. litemall-config's native repo is
  #   spring.cloud.config.server.composite[0].search-locations: classpath:/config
  # i.e. THE CONFIG SERVER'S OWN packaged config dir. So it served its own
  # application.yml — including `spring.application.name: config-server` and a
  # localhost:8761 Eureka URL — to every client that asked. authserver duly
  # registered itself as CONFIG-SERVER and dialled localhost:8761, ignoring the
  # correct EUREKA_CLIENT_SERVICEURL_DEFAULTZONE below.
  #
  # No per-service config exists in that repo (or in the git backend — the public
  # jovinuxien/litemall-config is empty scaffolding). Every service already ships
  # a complete application.yml + application-prod.yml, so the config server adds
  # nothing here and only corrupts client identity. Turning the client off is the
  # smallest correct fix; the server itself stays up and healthy.
  #
  # To re-enable it properly: point composite[0] at a directory of per-service
  # files (NOT classpath:/config), then drop this flag.
  SPRING_CLOUD_CONFIG_ENABLED: "false"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
  SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTHSERVER_TOKEN_URI: http://authserver:8089/oauth2/token
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://authserver:8089/oauth2/jwks
  # THE one svcsecurity actually reads. litemall-svcsecurity binds
  # litemall.svcsecurity.jwk-set-uri (SvcSecurityProperties), NOT the standard
  # spring.security.oauth2.resourceserver line above — so without this every
  # downstream service fell back to its yaml default http://localhost:8089,
  # which inside a container is the service itself. Result: the JWKS fetch fails,
  # EVERY machine token is rejected, and all admin + authenticated service-to-
  # service calls 401. Public storefront browsing still works (no token needed),
  # which is exactly why it looked fine until the first admin call (reindex).
  LITEMALL_SVCSECURITY_JWK_SET_URI: http://authserver:8089/oauth2/jwks
  # Register in Eureka by IP, not hostname. Several services hardcode
  # eureka.instance.hostname: localhost (e.g. goods-management application.yml:231),
  # so they register as hostName=localhost — and lb:// clients (the gateways) then
  # dial their OWN localhost:<port> and get Connection refused. preferIpAddress
  # makes the load balancer use the container IP, which is routable on this
  # network. Universal fix; no per-service hostname needed.
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

# serverTimezone=UTC, deliberately. The committed default is Asia/Shanghai
# (litemall-db/application-db.yml:9) — wrong for a US/EU store and a silent
# corrupter of order timestamps, tax periods and scheduler windows.
x-litemall-db: &litemall-db
  SPRING_DATASOURCE_DRUID_URL: &jdbc jdbc:mysql://mysql:3306/litemall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&verifyServerCertificate=false&useSSL=false
  SPRING_DATASOURCE_DRUID_USERNAME: ${MYSQL_USER:?set MYSQL_USER in .env}
  SPRING_DATASOURCE_DRUID_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
  SPRING_FLYWAY_URL: *jdbc
  SPRING_FLYWAY_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
  SPRING_FLYWAY_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}

# Timing only — each service supplies its own `test` against its own port.
# start_period is generous because a cold JVM + Eureka registration is slow, and
# a healthcheck that fires too early turns a healthy boot into a restart loop.
x-healthcheck: &litemall-healthcheck
  interval: 15s
  timeout: 5s
  retries: 20
  start_period: 90s

services:

  # =========================================================================
  # Ingress — the ONLY service published to the host (Task C).
  # Everything else is reachable only on the internal `litemall` network.
  # =========================================================================

  caddy:
    # Custom build = stock caddy + the cloudflare DNS module, needed for the
    # ACME DNS-01 challenge once the DNS records are proxied through Cloudflare
    # (HTTP-01 can't reach the origin from behind the proxy).
    build: {context: ../docker/caddy}
    image: litemall/caddy:latest
    restart: unless-stopped
    depends_on:
      gateway-api: {condition: service_healthy}
      gateway-admin: {condition: service_healthy}
    ports:
      - "80:80"     # ACME HTTP-01 challenge + the HTTPS redirect
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?set SHOP_DOMAIN in .env (use localhost for a local/staging run)}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
      # Matomo's hostname. Defaults to a .localhost name ON PURPOSE rather than
      # being required or blank: Caddy serves *.localhost from its internal CA,
      # so an unset value yields an unreachable site and NO public certificate
      # request. Blank would be worse than either — an empty site address fails
      # `caddy validate`, which is the edge's healthcheck, so forgetting this
      # variable would take the whole edge down instead of just Matomo.
      ANALYTICS_DOMAIN: ${ANALYTICS_DOMAIN:-analytics.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Whole `acme_dns cloudflare <token>` directive, injected into the
      # Caddyfile's global options (empty ⇒ the line vanishes and staging runs
      # tokenless on the internal CA). See the Caddyfile comment.
      CADDY_ACME_DNS: ${CADDY_ACME_DNS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes, deliberately: these hold the issued certificates and ACME
      # account key. Losing them on every `down` means re-issuing certs and
      # burning Let's Encrypt rate limits (5 certs/domain/week — easy to hit).
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    networks: [litemall]

  # =========================================================================
  # Data plane
  # =========================================================================

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00      # UTC; the dev my.cnf pinned +8:00.
      - --max-allowed-packet=100M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: litemall
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 1g
    networks: [litemall]

  elasticsearch:
    build:
      context: ../docker/elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # NO jdwp. The dev stack ships a debug agent on *:8000
      # (docker-compose/docker-compose.yml:64) — a remote code execution port.
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: {soft: -1, hard: -1}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 2g
    networks: [litemall]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    networks: [litemall]

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Tell RabbitMQ its real budget is the container limit, not host RAM —
      # see the comment in the conf file (memory-watermark alarm flapping).
      - ./rabbitmq/20-container-limits.conf:/etc/rabbitmq/conf.d/20-container-limits.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    mem_limit: 512m
    networks: [litemall]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # cp-zookeeper ships with only `srvr` in the four-letter-word whitelist.
      # Setting this env to add `ruok` did NOT take effect on 7.5.0 (the running
      # server still rejects ruok), so the healthcheck below uses `srvr` instead
      # — which is whitelisted by default and needs no env at all. Kept for intent.
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "srvr,ruok"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Zookeeper"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks: [litemall]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      zookeeper: {condition: service_healthy}
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    mem_limit: 1g
    networks: [litemall]

  # ---- OCS search tier (fronts Elasticsearch; goods-management talks to these)
  indexer:
    image: commerceexperts/ocs-indexer-service:latest
    restart: unless-stopped
    depends_on:
      elasticsearch: {condition: service_healthy}
    environment:
      ES_HOSTS: http://elasticsearch:9200
      # `custom` LOADS the mounted application-custom.yml (the field mapping);
      # `preset` is OCS's relevance preset. Mounting the file WITHOUT activating
      # the custom profile does nothing — Spring never reads it — which is why the
      # index came back empty even after the volume was added.
      SPRING_PROFILES_ACTIVE: preset,custom
    volumes:
      # The OCS field mapping — WITHOUT this the indexer has no field-configuration
      # for litemall_index, so it stores documents as empty shells (id + empty
      # resultData) and the whole catalog renders blank. Delivered as
      # application-custom.yml exactly as docker-compose.local.yml does for dev.
      - ./application.indexer-service.yml:/app/resources/application-custom.yml:ro
    mem_limit: 768m
    networks: [litemall]

  searcher:
    image: commerceexperts/ocs-search-service:latest
    restart: unless-stopped
    depends_on:
      elasticsearch: {condition: service_healthy}
    environment:
      ES_HOSTS: http://elasticsearch:9200
      SPRING_PROFILES_ACTIVE: preset,custom   # same as indexer — loads the mounted config
    volumes:
      # Search-side field config + relevance preset; the searcher must agree with
      # the indexer's mapping or queries return nothing usable.
      - ./application.search-service.yml:/app/resources/application-custom.yml:ro
    mem_limit: 768m
    networks: [litemall]

  suggest:
    image: commerceexperts/ocs-suggest-service:searchhub-latest
    restart: unless-stopped
    depends_on:
      elasticsearch: {condition: service_healthy}
    environment:
      # searchhub-latest refuses to start without an API key (SearchHub is unused
      # here and self-skips litemall_index); it also defaults ES to its own
      # localhost:9200 and silently degrades to a NoopQuerySuggester.
      SH_API_KEY: disabled
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SUGGEST_INDEX_DEFAULT_SOURCEFIELDS: title,brand,category_names
    mem_limit: 768m
    networks: [litemall]

  # =========================================================================
  # Platform services
  # =========================================================================

  eureka:
    <<: *litemall-common
    build: {<<: *litemall-build, target: litemall-eureka}
    image: litemall/eureka:${LITEMALL_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8761
    healthcheck: {<<: *litemall-healthcheck, test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]}
    mem_limit: 512m

  config:
    <<: *litemall-common
    build: {<<: *litemall-build, target: litemall-config}
    image: litemall/config:${LITEMALL_TAG:-latest}
    depends_on:
      eureka: {condition: service_healthy}
    environment:
      <<: *litemall-discovery
      # `composite` is NOT optional and NOT decoration: it is what wires the
      # config server's native+git repositories (application.yml:36-46). Setting
      # SPRING_PROFILES_ACTIVE=prod alone REPLACES it, leaving a config server
      # with no backing repository. It must be listed alongside prod.
      SPRING_PROFILES_ACTIVE: composite,prod
    # NOT published to the host. The config server actuator is at base-path
    # /admin with include:"*" AND endpoint.env.post.enabled — i.e. a writable,
    # unauthenticated POST /admin/env. application-prod.yml closes it; keeping
    # the port off the host is defence in depth.
    healthcheck: {<<: *litemall-healthcheck, test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]}
    mem_limit: 512m

  authserver:
    <<: *litemall-common
    build: {<<: *litemall-build, target: litemall-authserver}
    image: litemall/authserver:${LITEMALL_TAG:-latest}
    depends_on:
      eureka: {condition: service_healthy}
      config: {condition: service_healthy}
    environment:
      <<: *litemall-discovery
      SPRING_PROFILES_ACTIVE: prod
      # This service signs EVERY machine token and serves the JWKS both gateways
      # validate against. Its committed config sets private-key-pem:"" — so today
      # RsaKeys.from() silently generates an EPHEMERAL pair on every boot and all
      # tokens die on restart. Task B makes prod fail fast when these are absent.
      LITEMALL_JWT_PRIVATE_KEY_PEM: ${AUTHSERVER_JWT_PRIVATE_KEY_PEM:?set AUTHSERVER_JWT_PRIVATE_KEY_PEM in .env}
      LITEMALL_JWT_PUBLIC_KEY_PEM: ${AUTHSERVER_JWT_PUBLIC_KEY_PEM:?set AUTHSERVER_JWT_PUBLIC_KEY_PEM in .env}
      LITEMALL_AUTHSERVER_GATEWAY_API_SECRET: ${GATEWAY_API_CLIENT_SECRET:?set GATEWAY_API_CLIENT_SECRET in .env}
      LITEMALL_AUTHSERVER_GATEWAY_ADMIN_SECRET: ${GATEWAY_ADMIN_CLIENT_SECRET:?set GATEWAY_ADMIN_CLIENT_SECRET in .env}
    healthcheck: {<<: *litemall-healthcheck, test: ["CMD", "curl", "-fsS", "http://localhost:8089/actuator/health"]}
    mem_limit: 768m

  # =========================================================================
  # Edge gateways — the only services Caddy (Task C) fronts.
  # =========================================================================

  gateway-api:
    <<: *litemall-common
    build: {<<: *litemall-build, target: litemall-gateway-api}
    image: litemall/gateway-api:${LITEMALL_TAG:-latest}
    depends_on:
      mysql: {condition: service_healthy}
      authserver: {condition: service_healthy}
    environment:
      <<: [*litemall-discovery, *litemall-db]
      SPRING_PROFILES_ACTIVE: prod,db
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHSERVER_CLIENT_SECRET: ${GATEWAY_API_CLIENT_SECRET:?set GATEWAY_API_CLIENT_SECRET in .env}
      LITEMALL_JWT_PRIVATE_KEY_PEM: ${GATEWAY_API_JWT_PRIVATE_KEY_PEM:?set GATEWAY_API_JWT_PRIVATE_KEY_PEM in .env}
      LITEMALL_JWT_PUBLIC_KEY_PEM: ${GATEWAY_API_JWT_PUBLIC_KEY_PEM:?set GATEWAY_API_JWT_PUBLIC_KEY_PEM in .env}
      # Stripe PUBLISHABLE key (public by design), served to the SPA via
      # /auth/site-config so it can mount Stripe Elements. Blank ⇒ the card
      # option is hidden and checkout offers wallet only.
      LITEMALL_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # Wave-16 env-gated integrations, served to the SPA via /auth/site-config
      # (public by design). Blank ⇒ the feature is hidden entirely: no Google
      # button (/auth/google answers 707), no Meta Pixel, plain address fields.
      # Activation = set in .env + recreate this container, NO rebuild.
      LITEMALL_GOOGLE_CLIENT_ID: ${LITEMALL_GOOGLE_CLIENT_ID:-}
      # ⚠ Leave BLANK while the Meta Business account is restricted (2026-08-26). The pixel
      # is consent-gated and harmless on its own, but it is Meta traffic from this origin and
      # this is not the moment to add more of it.
      LITEMALL_META_PIXEL_ID: ${LITEMALL_META_PIXEL_ID:-}
      LITEMALL_PLACES_API_KEY: ${LITEMALL_PLACES_API_KEY:-}
      # i18n foundation: storefront languages enabled for shoppers (comma-separated,
      # `en` always on). The language switcher renders only when more than one is
      # listed, so leave this at `en` until the sv/da translations are reviewed.
      # Passthrough added WITH the feature (the LITEMALL_GOODS_PRICE_FLOOR lesson).
      LITEMALL_I18N_LANGUAGES: ${LITEMALL_I18N_LANGUAGES:-en}
      # Matomo, the self-hosted analytics. BLANK = OFF, which is what prod has been running
      # since launch — the store has had NO page/click analytics at all, so a flat dashboard
      # meant "nothing is counting", not "nobody visited". Only the first-party event log
      # (litemall_user_event) collects today, and it has no report screen.
      #
      # These two lines are the passthrough the config needs; without them .env.prod can
      # carry the values while the container runs blank and every surface reports it as
      # configured — the LITEMALL_GOODS_PRICE_FLOOR failure mode, again.
      #
      # To switch on: bring up the marketing stack's matomo container
      # (docker-compose.marketing.yml — matomo + matomo-db already defined), expose it on a
      # public hostname, run its web installer once, then set both values and recreate this
      # container. NO rebuild. BASE_URL must be the browser-reachable public URL WITH a
      # trailing slash; SITE_ID is the numeric id Matomo assigns.
      LITEMALL_TRACKING_MATOMO_BASE_URL: ${LITEMALL_TRACKING_MATOMO_BASE_URL:-}
      LITEMALL_TRACKING_MATOMO_SITE_ID: ${LITEMALL_TRACKING_MATOMO_SITE_ID:-}
      # Edge-local password-reset mail (Wave 6). Reads the SAME .env values as
      # order's customer-mail block, but the edge sender's property keys are
      # `user`/`pass` (not username/password) — mapped here so one .env set
      # drives both. Disabled by default; enabling = env change + recreate.
      LITEMALL_CUSTOMERMAIL_ENABLED: ${LITEMALL_CUSTOMERMAIL_ENABLED:-false}
      LITEMALL_CUSTOMERMAIL_HOST: ${LITEMALL_CUSTOMERMAIL_HOST:-localhost}
      LITEMALL_CUSTOMERMAIL_PORT: ${LITEMALL_CUSTOMERMAIL_PORT:-1025}
      LITEMALL_CUSTOMERMAIL_FROM: ${LITEMALL_CUSTOMERMAIL_FROM:-noreply@trovemo.com}
      LITEMALL_CUSTOMERMAIL_USER: ${LITEMALL_CUSTOMERMAIL_USERNAME:-}
      LITEMALL_CUSTOMERMAIL_PASS: ${LITEMALL_CUSTOMERMAIL_PASSWORD:-}
    healthcheck: {<<: *litemall-healthcheck, test: ["CMD", "curl", "-fsS", "http://localhost:8090/actuator/health"]}
    mem_limit: 1g

  gateway-admin:
    <<: *litemall-common
    build: {<<: *litemall-build, target: litemall-gateway-admin}
    image: litemall/gateway-admin:${LITEMALL_TAG:-latest}
    depends_on:
      mysql: {condition: service_healthy}
      authserver: {condition: service_healthy}
    environment:
      <<: [*litemall-discovery, *litemall-db]
      SPRING_PROFILES_ACTIVE: prod,db
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHSERVER_CLIENT_SECRET: ${GATEWAY_ADMIN_CLIENT_SECRET:?set GATEWAY_ADMIN_CLIENT_SECRET in .env}
      LITEMALL_JWT_PRIVATE_KEY_PEM: ${GATEWAY_ADMIN_JWT_PRIVATE_KEY_PEM:?set GATEWAY_ADMIN_JWT_PRIVATE_KEY_PEM in .env}
      LITEMALL_JWT_PUBLIC_KEY_PEM: ${GATEWAY_ADMIN_JWT_PUBLIC_KEY_PEM:?set GATEWAY_ADMIN_JWT_PUBLIC_KEY_PEM in .env}
    healthcheck: {<<: *litemall-healthcheck, test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]}
    mem_limit: 1g

  # =========================================================================
  # Domain services
  # =========================================================================

  order:
    <<: *litemall-common
    build: {<<: *litemall-build, target: litemall-order}
    image: litemall/order:${LITEMALL_TAG:-latest}
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_healthy}
      authserver: {condition: service_healthy}
    environment:
      <<: [*litemall-discovery, *litemall-db]
      SPRING_PROFILES_ACTIVE: prod,db,core,elastic,admin,wx
      LITEMALL_KAFKA_BROKERS: kafka:9092
      # Stripe + CJ + mail land here in Task B / order's Wave-7 work. Blank ⇒
      # the adapter stays disabled and returns a typed 402 — never a fake success.
      # Property names are order's litemall.order.stripe.* (application.yml:156-160);
      # boot FAILS if ENABLED=true without a secret key.
      LITEMALL_ORDER_STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      LITEMALL_ORDER_STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      LITEMALL_ORDER_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      LITEMALL_CJ_API_KEY: ${CJ_API_KEY:-}
      # CJ auth needs the account email alongside the key (Wave 8: the committed
      # dev credentials are gone from order's application.yml). BOTH blank ⇒ CJ
      # disabled: payment settles, paid CJ orders are retained and auto-placed
      # once the pair appears. Exactly one set ⇒ order REFUSES TO BOOT.
      CJ_EMAIL: ${CJ_EMAIL:-}
      CJ_OPS_MAIL: ${CJ_OPS_MAIL:-}
      # Wave 24 (EUR storefront): USD→EUR rate for CJ freight amounts at the quote
      # seam (litemall.order.fx-usd-eur). 1.0 = identity (dormant). Deploy-day flip
      # sets the real rate in .env TOGETHER with LITEMALL_GOODS_CURRENCY=EUR and
      # LITEMALL_ORDER_STRIPE_CURRENCY=eur (single staged pass, MAIN session).
      LITEMALL_FX_USD_EUR: ${LITEMALL_FX_USD_EUR:-1.0}
      # order mints its OWN machine token (GoodsMachineTokenProvider) to call
      # goods-management when it re-resolves a cart line's price server-side. It
      # reads litemall.goods.auth.* — NOT the standard spring.security.oauth2
      # property the discovery anchor sets — so without these it fell back to the
      # baked defaults: token-uri http://localhost:8089 (nothing there inside the
      # order container → ConnectException "Unable to obtain goods machine token")
      # and client-secret gateway-api-dev-secret (wrong for prod). The visible
      # symptom was add-to-cart 502 → empty server cart → $0 checkout total.
      LITEMALL_GOODS_AUTH_TOKEN_URI: http://authserver:8089/oauth2/token
      LITEMALL_GOODS_AUTH_CLIENT_ID: gateway-api
      LITEMALL_GOODS_AUTH_CLIENT_SECRET: ${GATEWAY_API_CLIENT_SECRET:?set GATEWAY_API_CLIENT_SECRET in .env}
      # order's Feign clients dial these by DIRECT url (not lb://Eureka), and the
      # committed defaults are http://localhost:{8082,8088} — nothing there inside
      # the order container. Same class of gap as the token-uri above; without them
      # add-to-cart/checkout 502s (goods price re-resolve) and coupons fail.
      GOODS_SERVICE_URL: http://goods-management:8082
      PROMOTION_SERVICE_URL: http://promotion-service:8088
      # Customer transactional mail (Wave 6 outbox, Wave 10 rich confirmation).
      # DARK BY DEFAULT: enabled=false keeps the no-op logging sender bound and
      # writes no outbox rows — byte-identical behaviour. Real SMTP creds are a
      # USER-SIDE PREREQUISITE (none exist yet); to go live, set the env vars in
      # .env and `docker compose up -d order` (container recreate, NO rebuild).
      # HOST/PORT keep harmless structural defaults (an empty PORT would break
      # int binding at boot). WARNING: the 60s outbox sweeper claims no rows —
      # scaling the order service beyond one instance duplicates customer emails.
      LITEMALL_CUSTOMERMAIL_ENABLED: ${LITEMALL_CUSTOMERMAIL_ENABLED:-false}
      LITEMALL_CUSTOMERMAIL_HOST: ${LITEMALL_CUSTOMERMAIL_HOST:-localhost}
      LITEMALL_CUSTOMERMAIL_PORT: ${LITEMALL_CUSTOMERMAIL_PORT:-1025}
      LITEMALL_CUSTOMERMAIL_FROM: ${LITEMALL_CUSTOMERMAIL_FROM:-noreply@trovemo.com}
      LITEMALL_CUSTOMERMAIL_USERNAME: ${LITEMALL_CUSTOMERMAIL_USERNAME:-}
      LITEMALL_CUSTOMERMAIL_PASSWORD: ${LITEMALL_CUSTOMERMAIL_PASSWORD:-}
      # Wave 23 (V59): admin-gated CJ placement. manual (the default, also the
      # jar's own default) = paid CJ orders wait for an admin approval stamp
      # before the sweep places them; auto = pre-Wave-23 behaviour. The notify
      # address gets a "New paid order" mail per paid order via the same outbox
      # (blank = no admin notices). Compose passthrough is EXPLICIT — without
      # these lines the container never sees the env (the Wave-18 lesson).
      LITEMALL_ORDER_CJ_PLACEMENT_MODE: ${LITEMALL_ORDER_CJ_PLACEMENT_MODE:-manual}
      LITEMALL_CUSTOMERMAIL_ADMIN_NOTIFY: ${LITEMALL_CUSTOMERMAIL_ADMIN_NOTIFY:-}
      # CJ placement realism: yml default is sandbox=true (simulated payment) so
      # dev stays harmless; prod .env.prod sets false — an approved order must
      # REALLY place, a simulation answering an approval is a fake success.
      LITEMALL_ORDER_CJ_SANDBOX: ${LITEMALL_ORDER_CJ_SANDBOX:-true}
      # Wave 24: Stripe charge currency (litemall.order.stripe.currency,
      # application.yml:204). Without this passthrough a deploy-day .env flip to
      # eur would silently no-op — the container would keep charging usd.
      LITEMALL_ORDER_STRIPE_CURRENCY: ${LITEMALL_ORDER_STRIPE_CURRENCY:-usd}
      # ⚠ SEPARATE KEY ON PURPOSE (mirror of goods-management's). application.yml
      # sets org.linlinjava.litemall.db: DEBUG = every SQL statement with its bound
      # parameters — customer PII and Stripe intent ids straight into `docker logs`,
      # and the 30 MB json-file rotation fills with SQL within minutes so real
      # ERRORs are gone before anyone reads them. Spring resolves the MOST SPECIFIC
      # logger key, so only this key holds it down. application-prod.yml pins it
      # too; this env makes it effective with a container RECREATE, no rebuild.
      # Set DEBUG to get per-SQL detail back temporarily — do not leave it on.
      LOGGING_LEVEL_ORG_LINLINJAVA_LITEMALL_DB: ${LITEMALL_ORDER_DB_LOG_LEVEL:-INFO}
    healthcheck: {<<: *litemall-healthcheck, test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]}
    mem_limit: 1g

  goods-management:
    <<: *litemall-common
    build: {<<: *litemall-build, target: litemall-goods-management}
    # goods-management is the only service with a file-logging logback-spring.xml
    # (writes /app/logs). tmpfs gives it a writable, ephemeral dir without a
    # rebuild; the permanent fix (mkdir in docker/Dockerfile) applies next clean build.
    # ⚠ SIZE CAP IS LOAD-BEARING: tmpfs pages are charged to this container's memory
    # cgroup, so an uncapped log directory eats the JVM's budget. On 2026-08-15 log.log
    # reached 611 MB against a 1.5 GiB limit (90.7% used) and the container was
    # OOM-KILLED at 03:30:02, mid-enrichment. logback now caps itself too (~120 MB worst
    # case: 100 MB log + 20 MB error), so this 256 MB is the SECOND guard, deliberately
    # above logback's own ceiling — if they were equal, a logback regression would hit
    # the tmpfs wall instead of being caught by its own cap.
    tmpfs:
      - /app/logs:size=256m
    volumes:
      # Keyword export, read-only. The default source is `file`, and the path in
      # application.yml resolves against ${user.home} — which inside this container
      # is NOT the host's home, so without this mount the provider finds nothing and
      # serves no keywords (fail-soft: it warns once, it does not break the service).
      # Host path is overridable so the export can live anywhere.
      - ${LITEMALL_SEO_EXPORT_DIR:-./seo-export}:/app/seo-export:ro
    image: litemall/goods-management:${LITEMALL_TAG:-latest}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      authserver: {condition: service_healthy}
    environment:
      <<: [*litemall-discovery, *litemall-db]
      SPRING_PROFILES_ACTIVE: prod,db,core,admin,wx
      LITEMALL_KAFKA_BROKERS: kafka:9092
      LITEMALL_SEARCH_INDEXER_URL: http://indexer:8535
      LITEMALL_SEARCH_SEARCH_URL: http://searcher:8534
      LITEMALL_SEARCH_SUGGEST_URL: http://suggest:8081
      REDIS_SERVER_HOST: redis
      REDIS_SERVER_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      # CJ CATALOG credentials — goods-management binds spring.cjdropship.api.auth
      # from the container vars CJ_API_KEY/CJ_EMAIL (application.yml:44-45; the
      # LITEMALL_CJ_API_KEY name previously passed here was never read by this
      # service). Deliberately fed from CJ_CATALOG_* host vars, NOT the CJ_API_KEY
      # that the order service reads: this pair unlocks READ-ONLY catalog work —
      # on-demand variant enrichment (what makes a shallow CJ good orderable),
      # nightly refresh, reviews — while order-side CJ placement (which spends
      # real money at CJ) stays governed by its own CJ_API_KEY/CJ_EMAIL pair.
      # Both blank ⇒ enrichment fails soft exactly as before.
      CJ_API_KEY: ${CJ_CATALOG_API_KEY:-}
      CJ_EMAIL: ${CJ_CATALOG_EMAIL:-}
      # seo_plateform keyword research, read through infrastructure/acl/seo.
      # DARK BY DEFAULT and it must stay dark until two things are true, because
      # the platform behind it BUYS this data per seed from a pay-as-you-go
      # provider — switching it on is what starts spending:
      #   1. seo_plateform is reachable FROM THIS CONTAINER. The base/token URLs
      #      below default to localhost, which inside a container means the
      #      container itself, not the host. Pointing them at a host-run platform
      #      needs the host address (172.17.0.1, or host.docker.internal with an
      #      extra_hosts entry — this file has none today).
      #   2. The provider account has credit. It ran dry mid-pull on 2026-08-24
      #      after $0.64, and the platform surfaces that as 502 wrapping the
      #      provider's 402 — not as a clean payment error.
      # `file` reads the mounted export — costs nothing, needs no network and no
      # identity provider, and is what makes the data already bought usable here.
      # `platform` buys live and is what ENABLED below gates.
      # Seasonal candidacy. Dark-safe defaults; auto-publish is the switch that lets a scored
      # product reach a season page, and per-season-cap bounds how many ever show.
      LITEMALL_SEASONS_ENABLED: ${LITEMALL_SEASONS_ENABLED:-true}
      LITEMALL_SEASONS_AUTO_PUBLISH: ${LITEMALL_SEASONS_AUTO_PUBLISH:-true}
      LITEMALL_SEASONS_AUTO_TIER: ${LITEMALL_SEASONS_AUTO_TIER:-featured}
      LITEMALL_SEASONS_PER_SEASON_CAP: ${LITEMALL_SEASONS_PER_SEASON_CAP:-24}
      LITEMALL_SEASONS_SCAN_LIMIT: ${LITEMALL_SEASONS_SCAN_LIMIT:-200}
      LITEMALL_SEASONS_HOT_QUANTILE: ${LITEMALL_SEASONS_HOT_QUANTILE:-0.10}
      LITEMALL_SEASONS_FEATURED_QUANTILE: ${LITEMALL_SEASONS_FEATURED_QUANTILE:-0.35}
      LITEMALL_SEO_RESEARCH_SOURCE: ${LITEMALL_SEO_RESEARCH_SOURCE:-file}
      LITEMALL_SEO_RESEARCH_FILE: /app/seo-export/category-keywords-clean.csv
      LITEMALL_SEO_RESEARCH_ENABLED: ${LITEMALL_SEO_RESEARCH_ENABLED:-false}
      LITEMALL_SEO_RESEARCH_BASE_URL: ${LITEMALL_SEO_RESEARCH_BASE_URL:-}
      LITEMALL_SEO_RESEARCH_TOKEN_URI: ${LITEMALL_SEO_RESEARCH_TOKEN_URI:-}
      LITEMALL_SEO_RESEARCH_CLIENT_ID: ${LITEMALL_SEO_RESEARCH_CLIENT_ID:-litemall-goods}
      LITEMALL_SEO_RESEARCH_CLIENT_SECRET: ${LITEMALL_SEO_RESEARCH_CLIENT_SECRET:-}
      LITEMALL_SEO_RESEARCH_LOCATION: ${LITEMALL_SEO_RESEARCH_LOCATION:-2826}
      LITEMALL_SEO_RESEARCH_LANGUAGE: ${LITEMALL_SEO_RESEARCH_LANGUAGE:-en}
      # Wave 24 (EUR storefront) — the flip trio's goods half. currency feeds
      # /srv/goods/meta JSON-LD + meta-catalog.csv (litemall.goods.currency,
      # env-bound since Wave 13); fx is the CONTRACT-frozen shared rate the
      # goods EUR cost-intake seam reads (litemall.goods.fx-usd-eur — rides the
      # fix/goods-management merge; passing the env before that merge is inert).
      # Both dormant at their defaults until the deploy-day .env flip.
      LITEMALL_GOODS_CURRENCY: ${LITEMALL_GOODS_CURRENCY:-USD}
      LITEMALL_FX_USD_EUR: ${LITEMALL_FX_USD_EUR:-1.0}
      # Wave 26 Phase 2 — minimum retail (EUR) to stay on sale; 0 = OFF (default).
      # A sub-floor good is OFF-SALED, never repriced, every cycle it stays
      # sub-floor; reversible by setting the value back to 0. WITHOUT this line
      # the var in .env.prod never reaches the container and the floor silently
      # does nothing while looking set — the LITEMALL_GOODS_AUTH_* lesson.
      # ORDER MATTERS: the anchor margin must have landed a nightly cycle first,
      # or the floor judges anchor goods at their old 1.25x prices and off-sales
      # roughly twice as many. See runbook-wave26-phase2-anchor.md.
      LITEMALL_GOODS_PRICE_FLOOR: ${LITEMALL_GOODS_PRICE_FLOOR:-0}
      # Maximum retail to stay on sale (0 = OFF). Same off-sale semantics as the floor, and the
      # same passthrough trap: without this line .env.prod can carry the value while the
      # container runs at 0 and every surface reports it as configured.
      # Guards the other end of the band — outlier CJ costs put a EUR 32,819 sideboard and a
      # EUR 12,011 garage in the live merchant feed, the shape of listing that triggers an
      # account-level misrepresentation review. 97 rows sat above 500 on 2026-08-26.
      # Unlike the floor this has NO ordering dependency on the margin: raising the margin can
      # only push more rows over a ceiling, and off-sale is reversible either way.
      LITEMALL_GOODS_PRICE_CEILING: ${LITEMALL_GOODS_PRICE_CEILING:-0}
      # F17 (2026-09-13): product reviews require a delivered purchase of the goods (default
      # true). Set to false to restore the old any-authenticated-user behaviour without a
      # rebuild. Same passthrough trap as the floor: without this line .env.prod cannot
      # reach the container.
      LITEMALL_COMMENT_REQUIRE_PURCHASE: ${LITEMALL_COMMENT_REQUIRE_PURCHASE:-true}
      # L1 root ids the storefront is narrowed to (comma-separated; empty = OFF). Narrowing
      # off-sales today's goods, but the CJ pipeline keeps mirroring all 14 L1s and the nightly
      # promote lands every NEW product on sale — one night after narrowing, 328 new non-anchor
      # goods went live and the homepage started advertising emptied categories again. Applies to
      # NEW goods only, so /insight/narrow/restore still works. Clear it to un-narrow.
      LITEMALL_GOODS_ANCHOR_CATEGORY_IDS: ${LITEMALL_GOODS_ANCHOR_CATEGORY_IDS:-}
      # Now a KNOB, not the fix: logback-spring.xml is profile-scoped since Wave 26 and
      # already runs prod at INFO. Spring's logging.level.* overrides the XML either way,
      # so set this to DEBUG to get per-request and per-SQL detail back temporarily —
      # container recreate, no rebuild. ⚠ DEBUG is what wrote 611 MB in under two hours
      # and OOM-killed this container; the rolling caps now bound it, but do not leave it
      # on. INFO carries every line the Wave-26 runbooks read.
      LOGGING_LEVEL_ORG_LINLINJAVA_LITEMALL: ${LITEMALL_GOODS_LOG_LEVEL:-INFO}
      # ⚠ SEPARATE KEY ON PURPOSE. application.yml (and litemall-db's) set
      # org.linlinjava.litemall.db: DEBUG = every SQL statement, ~14k lines/minute. Spring
      # resolves the MOST SPECIFIC logger key, so the package-level override above cannot
      # hold it down — this is the one that actually silences the SQL firehose that filled
      # 611 MB and OOM-killed the container. application-prod.yml now sets it too; this env
      # is what makes it effective without waiting for a rebuild.
      LOGGING_LEVEL_ORG_LINLINJAVA_LITEMALL_DB: ${LITEMALL_GOODS_DB_LOG_LEVEL:-INFO}
      # Attempts per CJ /product/list page. CJ QPS-rejects ~17% of calls even at
      # a 3s pace; the pre-Wave-26 break-on-first-failure truncated a leaf to
      # zero products silently. Exposed so the pace can be tuned without a rebuild.
      LITEMALL_CJ_FETCH_RETRIES: ${LITEMALL_CJ_FETCH_RETRIES:-3}
      # Products enriched per nightly run. ⚠ CJ daily API points are shared
      # ACCOUNT-WIDE with ORDER PLACEMENT (same CJ account, different key pair),
      # so this is the FIRST knob to turn down if paid orders start parking on CJ
      # errors — a container recreate, no rebuild. 0 disables enrichment.
      # Enrichment aborts itself on quota exhaustion or 5 consecutive failures.
      LITEMALL_CJ_ENRICH_BATCH_SIZE: ${LITEMALL_CJ_ENRICH_BATCH_SIZE:-200}
    healthcheck: {<<: *litemall-healthcheck, test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]}
    mem_limit: 1536m

  promotion-service:
    <<: *litemall-common
    build: {<<: *litemall-build, target: litemall-promotion-service}
    image: litemall/promotion-service:${LITEMALL_TAG:-latest}
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_healthy}
      authserver: {condition: service_healthy}
    environment:
      <<: [*litemall-discovery, *litemall-db]
      SPRING_PROFILES_ACTIVE: prod,db,core,elastic,admin,wx
      LITEMALL_KAFKA_BROKERS: kafka:9092
      # Wave-6 marketing ACLs: absent ⇒ disabled, which is the safe default.
      MATOMO_AUTH_TOKEN: ${MATOMO_AUTH_TOKEN:-}
      MAUTIC_USERNAME: ${MAUTIC_USERNAME:-}
      MAUTIC_PASSWORD: ${MAUTIC_PASSWORD:-}
      # Wave-17 Postiz publishing: absent ⇒ feature hidden (errno 760), the
      # safe default. Values live in .env (base url = the deployed Postiz,
      # e.g. https://social.trovemo.com/api/public/v1; key from its
      # Settings → Public API). Activation = env + `up -d promotion-service`
      # (container recreate, NO rebuild).
      LITEMALL_POSTIZ_BASE_URL: ${LITEMALL_POSTIZ_BASE_URL:-}
      LITEMALL_POSTIZ_API_KEY: ${LITEMALL_POSTIZ_API_KEY:-}
      # Feign clients dial by DIRECT url; committed defaults are localhost with
      # ports that don't even match the real services (8083/8084). goods-service
      # → /srv/goods/videos on goods-management:8082; order-statistics → order:8085.
      GOODS_SERVICE_URL: http://goods-management:8082
      ORDER_SERVICE_URL: http://order:8085
      # Wave-18 coupon margin guard: machine token for the goods-management
      # margin-basis call (GoodsMachineTokenProvider — same recipe/env pair as
      # the order service above). The baked defaults are dev-only
      # (localhost:8089 + dev secret); inside this container nothing listens
      # on localhost:8089, so without these the guard fails CLOSED and EVERY
      # coupon create/update is rejected with "margin guard unavailable".
      LITEMALL_GOODS_AUTH_TOKEN_URI: http://authserver:8089/oauth2/token
      LITEMALL_GOODS_AUTH_CLIENT_SECRET: ${GATEWAY_API_CLIENT_SECRET:?set GATEWAY_API_CLIENT_SECRET in .env}
    healthcheck: {<<: *litemall-healthcheck, test: ["CMD", "curl", "-fsS", "http://localhost:8088/actuator/health"]}
    mem_limit: 1g

  loyalty-service:
    <<: *litemall-common
    build: {<<: *litemall-build, target: litemall-loyalty-service}
    image: litemall/loyalty-service:${LITEMALL_TAG:-latest}
    depends_on:
      mysql: {condition: service_healthy}
      authserver: {condition: service_healthy}
    environment:
      <<: [*litemall-discovery, *litemall-db]
      SPRING_PROFILES_ACTIVE: prod,db,core,elastic,admin,wx
      # wallet-service (/srv/wallet/{userId}/credit) lives in the ORDER service,
      # not a separate container; committed default is localhost:8088.
      WALLET_SERVICE_URL: http://order:8085
    healthcheck: {<<: *litemall-healthcheck, test: ["CMD", "curl", "-fsS", "http://localhost:8087/actuator/health"]}
    mem_limit: 768m

  # litemall-goodsapi-analytic is intentionally ABSENT — 9 services, not 10.
  # It does not compile (javax.* under Boot 3), no gateway routes to it, and its
  # bootstrap.yml registers in Eureka as "litemall-goods-management", so running
  # it would hijack the real service's registrations. Excluded from the reactor
  # in pom.xml; re-add here only once both are fixed.

  # ---------------------------------------------------------------------------
  # Matomo — self-hosted storefront analytics (2026-08-26)
  #
  # Lives here rather than in docker-compose.marketing.yml because that stack is
  # an opt-in DEV convenience (its own compose project, its own network, a host
  # port published, no memory limits). Production needs the opposite on all four:
  # the same network Caddy is on, a memory cap, and NO published host port — the
  # only way in is through the edge, which terminates TLS and is the single
  # audited entry point.
  #
  # Reached at ${ANALYTICS_DOMAIN} via the Caddyfile block of the same name.
  # ---------------------------------------------------------------------------
  matomo-db:
    image: mariadb:10.11
    restart: unless-stopped
    # Matomo's archiving queries build large rows; the default 16MB packet trips
    # them once a site has real traffic.
    command: --max-allowed-packet=64MB
    environment:
      MARIADB_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD:?set MATOMO_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MATOMO_DB_NAME:-matomo}
      MARIADB_USER: ${MATOMO_DB_USER:-matomo}
      MARIADB_PASSWORD: ${MATOMO_DB_PASSWORD:?set MATOMO_DB_PASSWORD in .env}
    volumes:
      - matomo-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 768m
    networks: [litemall]

  matomo:
    image: matomo:5
    restart: unless-stopped
    depends_on:
      matomo-db: {condition: service_healthy}
    environment:
      # Pre-fills the installer's database step so that screen is a formality.
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysqli
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME:-matomo}
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER:-matomo}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD:?set MATOMO_DB_PASSWORD in .env}
    volumes:
      - matomo-data:/var/www/html
    # No `ports:` on purpose — Caddy proxies to matomo:80 over the internal
    # network. Publishing 8095 on the host would put the admin UI on the public
    # internet on plain HTTP, bypassing the edge entirely.
    mem_limit: 768m
    networks: [litemall]

networks:
  litemall:
    driver: bridge

volumes:
  caddy-data:      # issued TLS certs + ACME account key — do NOT discard casually
  caddy-config:
  mysql-data:
  es-data:
  redis-data:
  rabbitmq-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  matomo-data:     # Matomo's config.ini.php lives here — losing it means reinstalling
  matomo-db-data:
