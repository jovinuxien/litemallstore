# RabbitMQ runs under a 512 MiB compose mem_limit but detects the HOST's
# memory (16 GB on the prod VPS) and set its high watermark at ~6.5 GB —
# unreachable before the cgroup OOM-kills the container — while os_mon's
# system-level memory alarm flapped on host pressure (observed live 2026-07-20:
# repeated set/clear of system_memory_high_watermark). Pin the budget to the
# container limit so the watermark is real: 0.6 * 512 MiB ≈ 307 MiB, well above
# the ~140 MiB steady-state, well below the cgroup kill line.
total_memory_available_override_value = 536870912
vm_memory_high_watermark.relative = 0.6
