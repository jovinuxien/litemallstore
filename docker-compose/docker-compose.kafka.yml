# Single-node Kafka (+ Zookeeper) for local dev so the order service's domain-event
# producer/consumer work normally. Brokers are advertised as localhost:9092 because the
# litemall services run on the HOST (not in this compose network); a host client connects
# to the mapped 9092. The order's topics are pre-created (auto-create is also on as a backup).
#
#   Up:    docker compose -f docker-compose/docker-compose.kafka.yml up -d
#   Down:  docker compose -f docker-compose/docker-compose.kafka.yml down
#
# Order points at it via litemall.kafka.brokers (default localhost:9092).
version: '3'
services:
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: litemall-zookeeper
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka:2.13-2.7.0
    container_name: litemall-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "litemall.order.created.v1:1:1,litemall.order.payment-succeeded.v1:1:1,litemall.groupon.participated.v1:1:1"
    restart: unless-stopped
