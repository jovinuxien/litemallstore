spring:
  logging:
    level:
      de.cxp.ocs: DEBUG


ocs:
  index-config:
    litemall_index:  # This should match your JSON's finalIndexName
      field-configuration:
        fields:

          id:
            name: product_id
            type: id
            usage:
              - Result

          title:
            name: title
            type: string
            usage:
              - Search
              - Result
              - Sort
          price:
            name: price
            type: number
            usage:
              - Result
              - Sort
              - Facet

          discount_price:
            name: discount_price
            type: number
            usage:
              - Result
              - Sort

          description:
            name: description
            type: string
            usage:
              - Search
              - Result

          image_url:
            name: image_url
            type: string
            usage:
              - Result

          brand:
            name: brand
            type: string
            usage:
              - Search
              - Result
              - Facet


          category_names:
            name: category_names
            type: string
            usage:
              - Search
              - Result
              - Facet

          category_ids:
            name: category_ids
            type: string
            usage:
              - Facet

          # Document origin: "local" (DB goods) or "cj_dropshipping" (CJ catalog).
          # Result so the customer DTO can tag a hit; Facet so origin is an optional
          # filter — but it never default-scopes the unified result set.
          source:
            name: source
            type: string
            usage:
              - Result
              - Facet

          # Ranking signals (V31), master-level numerics. Sort so the discovery rails order on
          # them (SuperDeals = -listed_num, New Arrivals = -created_epoch); Score so the
          # search-service scoring-configuration can field_value_factor them into relevance
          # (price × popularity × recency × reviews, per Relevant Search ch. 7).
          listed_num:
            name: listed_num
            type: number
            usage:
              - Result
              - Sort
              - Score

          review_count:
            name: review_count
            type: number
            usage:
              - Result
              - Sort
              - Score

          rating:
            name: rating
            type: number
            usage:
              - Result
              - Sort
              - Score

          created_epoch:
            name: created_epoch
            type: number
            usage:
              - Result
              - Sort
              - Score

          # Deal signals, computed at index time from the counter/retail price split
          # (LitemallProductIndexingService). discount_pct: Filter not Facet — the SPA renders
          # its own labeled discount chips ("25–50%" → discount_pct=25,50 closed-range filter;
          # OCS filters work on Filter-usage fields), and a Facet would pollute the general
          # search rail with an auto-interval bucket dominated by 0-discount goods. Sort
          # (-discount_pct = "deepest discount"); Score (ln2p factor in the searcher's
          # scoring-configuration). deal_flag: deal_flag=1 scopes every deals surface.
          discount_pct:
            name: discount_pct
            type: number
            usage:
              - Result
              - Sort
              - Filter
              - Score

          deal_flag:
            name: deal_flag
            type: number
            usage:
              - Result
              - Filter

          # Wave-19 coupon visibility: coupon_flag=1 = an active publicly-claimable coupon's
          # scope matches this product. Filter powers the "Has coupon" toggle; Result powers
          # the card badge. Same always-emit rule as deal_flag.
          coupon_flag:
            name: coupon_flag
            type: number
            usage:
              - Result
              - Filter

          # Live flash-deal signals (price-swap lifecycle) — emitted only while a deal is live.
          # deal_active: Filter (deal_active=1 scopes "live deals only"); deal_end_epoch: Sort
          # (sort=deal_end_epoch = "ending soon") + Result (card countdown); deal_claimed_pct:
          # Result (claimed bar); deal_urgency: Score (index-time gaussian the scheduler keeps
          # fresh — OCS SCRIPT_CODE takes no params, so no query-time decay; spike 2026-07-15).
          deal_active:
            name: deal_active
            type: number
            usage:
              - Result
              - Filter

          deal_end_epoch:
            name: deal_end_epoch
            type: number
            usage:
              - Result
              - Sort

          deal_claimed_pct:
            name: deal_claimed_pct
            type: number
            usage:
              - Result

          deal_urgency:
            name: deal_urgency
            type: number
            usage:
              - Result
              - Score

          # Per-SKU variant fields (litemall_goods_product). field-level: variant means OCS indexes
          # them on each variant sub-document, facets/filters across SKUs, and flattens the matched
          # SKU into the hit. variant_price mirrors the SKU price; stock drives an in-stock filter.
          variant_price:
            name: variant_price
            type: number
            usage:
              - Result
              - Sort
              - Facet
            field-level: variant

          stock:
            name: stock
            type: number
            usage:
              - Result
              - Filter
              # Item 5 (in-stock discovery boost): Score usage lands stock in the
              # variant `scores` block so the searcher's scoring-configuration can
              # boost in-stock SKUs. No new field, no Java change.
              - Score
            field-level: variant

        # Curated litemall_goods_attribute name->value pairs ride as extra flat data keys; this template
        # turns each into a facet with no per-attribute config. Curation is done at index time
        # (litemall.search.facet-attributes), so only chosen attributes ever reach the document.
        # The negative-lookahead excludes the nine fixed schema keys so e.g. product_id never
        # becomes a junk facet; everything else (the curated attributes) is matched.
        dynamic-fields:
          - name: attribute_string
            type: string
            source-names:
              - '^(?!(product_id|title|price|discount_price|description|image_url|brand|category_names|category_ids|source|listed_num|review_count|rating|created_epoch|discount_pct|deal_flag|coupon_flag|deal_active|deal_end_epoch|deal_claimed_pct|deal_urgency)$).*$'
            usage:
              - Facet
              - Result
          - name: attribute_number
            type: number
            source-names:
              - '^(?!(product_id|title|price|discount_price|description|image_url|brand|category_names|category_ids|source|listed_num|review_count|rating|created_epoch|discount_pct|deal_flag|coupon_flag|deal_active|deal_end_epoch|deal_claimed_pct|deal_urgency)$).*$'
            usage:
              - Facet
              - Result


