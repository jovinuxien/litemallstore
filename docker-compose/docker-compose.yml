version: "3.5"


services:
    indexer:
      container_name: ocs_indexer
      image: commerceexperts/ocs-indexer-service:latest
      environment:
        - "ES_HOSTS=http://elasticsearch:9200"
      ports:
        - 8535:8535
      depends_on:
        - elasticsearch
      networks:
        - ocs

    searcher:
      container_name: ocs_searcher
      image: commerceexperts/ocs-search-service:latest
      environment:
        - "ES_HOSTS=http://elasticsearch:9200"
      ports:
        - 8534:8534
      depends_on:
        - elasticsearch
      networks:
        - ocs

    suggest:
      container_name: ocs_suggest
      image: commerceexperts/ocs-suggest-service:searchhub-latest
      environment:
        # searchhub-latest aborts startup without an API key (SearchHub is unused
        # here and self-skips litemall_index); it also defaults ES to
        # localhost:9200 (itself) with no harvest source, falling back to a
        # NoopQuerySuggester. These three make the ElasticsearchSuggestDataProvider
        # harvest the index and serve real suggestions.
        - "SH_API_KEY=disabled"
        - "ELASTICSEARCH_HOSTS=http://elasticsearch:9200"
        - "SUGGEST_INDEX_DEFAULT_SOURCEFIELDS=title,brand,category_names"
      ports:
        - 8081:8081
      depends_on:
        - elasticsearch
      networks:
        - ocs

    elasticsearch:
      container_name: ocs_elasticsearch
      image: docker.elastic.co/elasticsearch/elasticsearch:7.17.25
      # to install plugins at elasticsearch, we add a docker-entrypoint.sh that makes sure certain plugins are installed
      # make sure the ./elasticsearch/docker-entrypoint-es.sh file is executable
      volumes:
        - ./elasticsearch:/mnt
        - ocs_esdata:/usr/share/elasticsearch/data
      entrypoint:
        - /mnt/docker-entrypoint-es.sh
      ports:
        - 9200:9200
      environment:
        - "discovery.type=single-node"
        - "http.cors.enabled=true"
        - "http.cors.allow-origin=/https?://localhost(:[0-9]+)?/"
        # No JDWP. This previously carried
        #   -agentlib:jdwp=transport=dt_socket,server=y,address=*:8000,suspend=n
        # which binds a debug agent to ALL interfaces — anyone who can reach
        # :8000 gets arbitrary code execution inside the ES container. Nothing
        # here needs to debug Elasticsearch itself. Re-add it bound to
        # 127.0.0.1 only if you genuinely must.
        - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
      ulimits:
        memlock:
          soft: -1
          hard: -1
      networks:
        - ocs


    kibana:
      container_name: ocs_kibana
      image: docker.elastic.co/kibana/kibana:7.17.0
      ports:
        - 5601:5601
      environment:
        - "ELASTICSEARCH_HOST=http://elasticsearch:9200/"
      links:
        - elasticsearch
      networks:
        - ocs
    rabbitmq:
      image: rabbitmq:management
      ports:
        - "5672:5672" #JMS Port
        - "15672:15672" #Management Port - default user:pass = guest:guest

    redis:
      container_name: ocs_redis
      image: redis:7
      # Staging buffer for raw CJ Dropshipping payloads (fetch → Redis → DB → OCS).
      # Published on 6379 so goods-management running on the host (default/localhost
      # profile) reaches it; inside compose the `docker` profile points at host `redis`.
      ports:
        - "6379:6379"
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 10
      networks:
        - ocs

    # Keycloak REMOVED (Wave 7). The locked auth design is explicit: NO Keycloak
    # — both edges issue their own JWTs and service-to-service uses
    # client_credentials against litemall-authserver. Nothing referenced this
    # container, it published 9080/9443 to the host, shipped admin/admin, and its
    # imported realm carried a committed client secret that gitleaks flagged.
    # Realm config deleted with it (docker-compose/realm-config/).


volumes:
  ocs_esdata:
    driver: local

networks:
  ocs:
    name: ocs
    driver: bridge