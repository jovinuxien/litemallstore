spring:
  logging:
    level:
      de.cxp.ocs: DEBUG

# OCS search-service relevance tuning for the litemall_index.
#
# WHY THIS FILE EXISTS: the bundled `preset` profile (application-preset.yml in the
# ocs-search-service image) weights ONLY the OCS-canonical fields `title`, `brand`,
# `category_leaf` and `category_lvl_0..3` — and NOT `description` or `category_names`.
# Our documents (see docker-compose/application.indexer-service.yml) carry a FLAT
# `category_names` list and a searchable `description`, and have NO `category_leaf`/
# `category_lvl_*`. So with the preset weights a query like "luggage" (which only
# appears in the "Functional luggage" category name) matched nothing, and description
# text was never scored. This profile (`custom`, layered over `preset`) restates the
# text query strategies to weight the fields we actually index.
#
# Field weights: title is the strongest signal, then category_names and brand, then
# description (broad but noisy). `<field>.standard` is OCS's standard-analyzer twin of
# a Search field; unmapped weighted fields are ignored by Elasticsearch, so listing a
# `.standard` twin that doesn't exist is harmless.
ocs:
  default-tenant-config:
    # Item 3 (synonyms): OCS exposes NO index-time synonym/analyzer override
    # (index-settings only carries replica-count/refresh-interval), so synonyms are
    # applied at QUERY time via Querqy. The QuerqyQueryExpander rewrites the user
    # query using the curated common-rules file mounted into the searcher container
    # (docker-compose.local.yml). No reindex needed; rules edits take effect on a
    # searcher restart. Curated source: ./querqy-rules.txt.
    query-processing:
      user-query-analyzer: "de.cxp.ocs.elasticsearch.query.analyzer.QuerqyQueryExpander"
    plugin-configuration:
      "[de.cxp.ocs.elasticsearch.query.analyzer.QuerqyQueryExpander]":
        "common_rules_url": "/app/resources/querqy-rules.txt"
        "do_lowercase_rules": "true"
    # Item 5 (in-stock discovery boost): boost in-stock products, demote out-of-stock.
    # References the EXISTING per-SKU `stock` variant field (granted Score usage in
    # application.indexer-service.yml). The preset ships an equivalent field_value_factor
    # on `stock`, but it is silently ignored until `stock` carries a Score usage; this
    # block restates it deliberately.
    #
    # boost-mode MULTIPLY with the ln1p modifier: an out-of-stock SKU yields
    # ln1p(0)=0, so its final score is relevance*0 = 0 — it falls below EVERY in-stock
    # match regardless of relevance (satisfies "out-of-stock never above in-stock").
    # Any in-stock SKU keeps a positive multiplier (ln1p saturates, so stock 50 vs 400
    # differ only mildly), so relevance still drives ordering among in-stock products,
    # with higher availability a gentle tie-breaker. USE_FOR_VARIANTS applies it at the
    # SKU level where stock lives. Popularity boosting is deferred (no sales signal yet).
    # Quality/discovery boost (Relevant Search ch. 7 — "general-quality metrics" §7.4.6, combined by
    # multiplication §7.4.8). Every factor is field_value_factor multiplied into relevance. The
    # quality signals (rating, review_count, listed_num) use MODIFIER ln2p = ln(2+x): a no-signal
    # product (x=0, e.g. any local goods for listed_num) yields a UNIFORM ~0.69 — never 0, never
    # source-biased — and a product rises only on the signals it has (rating≈1.95 @5★,
    # review_count≈4.6 @100, listed_num≈3.1 @20). stock keeps ln1p (out-of-stock → 0, a deliberate
    # hard demote). Recency (created_epoch) drives the New Arrivals rail via an explicit -sort;
    # a global recency decay is a documented follow-up (needs a decay function, not field_value_factor).
    scoring-configuration:
      boost-mode: multiply
      score-mode: multiply
      score-functions:
        - type: field_value_factor
          field: stock
          options:
            MODIFIER: "ln1p"
            MISSING: 0
            FACTOR: 1
            USE_FOR_VARIANTS: "true"
        - type: field_value_factor
          field: rating
          options:
            MODIFIER: "ln2p"
            MISSING: 0
            FACTOR: 1
        - type: field_value_factor
          field: review_count
          options:
            MODIFIER: "ln2p"
            MISSING: 0
            FACTOR: 1
        - type: field_value_factor
          field: listed_num
          options:
            MODIFIER: "ln2p"
            MISSING: 0
            FACTOR: 1
    query-configuration:
      # AND-match across fields (primary strategy for normal multi-term queries)
      default-query:
        strategy: "ConfigurableQuery"
        condition:
          minTermCount: 1
          maxTermCount: 10
        settings:
          operator: "AND"
          tieBreaker: 0.7
          multimatch_type: "CROSS_FIELDS"
          analyzer: "standard"
          quoteAnalyzer: "minimal"
          isQueryWithShingles: true
          allowParallelSpellcheck: false
          # Item 1 (multi-term typo tolerance): recover misspelled multi-term queries
          # at query_stage 0 instead of dropping to the weaker relaxed/ngram fallbacks.
          fuzziness: "AUTO"
        weightedFields:
          "[title]": 4
          "[title.standard]": 3
          "[category_names]": 2.5
          "[category_names.standard]": 2
          "[brand]": 2
          "[brand.standard]": 1.5
          "[description]": 1
          "[description.standard]": 0.8
      # OR-with-relaxation pre-fetch for 2+ term queries
      relaxed-query:
        strategy: "RelaxedQuery"
        condition:
          minTermCount: 2
          maxTermCount: 10
        settings:
          analyzer: "standard"
          fallbackQuery: "relaxed-ngram-query"
          tieBreaker: 0.2
        weightedFields:
          "[title]": 4
          "[title.standard]": 3
          "[category_names]": 2.5
          "[category_names.standard]": 2
          "[brand]": 2
          "[brand.standard]": 1.5
          "[description]": 1
          "[description.standard]": 0.8
      # real fuzzy search for single-term queries (typo tolerance)
      one-term-fuzzy-search:
        strategy: "ConfigurableQuery"
        condition:
          maxTermCount: 1
        settings:
          tieBreaker: 0.7
          acceptNoResult: false
          allowParallelSpellcheck: false
          fuzziness: "AUTO"
        weightedFields:
          # Item 2 (stemming/plurals): the .standard twins use OCS's `standard`
          # analyzer (lowercase + light_english stemmer + stop-words), so weighting
          # them here extends plural/stem matching to the fuzzy & ngram stages too
          # (default/relaxed already weight them).
          "[title]": 4
          "[title.standard]": 3
          "[category_names]": 2.5
          "[category_names.standard]": 2
          "[brand]": 2
          "[brand.standard]": 1.5
          "[description]": 1
          "[description.standard]": 0.8
      # ngram/decomposition fallback (catches partials & harder typos)
      relaxed-ngram-query:
        strategy: "NgramQuery"
        condition:
          maxTermCount: 10
        settings:
          minShouldMatch: "80%"
          tieBreaker: 0.2
        weightedFields:
          # Item 2 (stemming/plurals): the .standard twins use OCS's `standard`
          # analyzer (lowercase + light_english stemmer + stop-words), so weighting
          # them here extends plural/stem matching to the fuzzy & ngram stages too
          # (default/relaxed already weight them).
          "[title]": 4
          "[title.standard]": 3
          "[category_names]": 2.5
          "[category_names.standard]": 2
          "[brand]": 2
          "[brand.standard]": 1.5
          "[description]": 1
          "[description.standard]": 0.8
      # very long queries (10+ terms)
      fallback-search:
        strategy: "ConfigurableQuery"
        condition:
          minTermCount: 10
        settings:
          analyzer: "standard"
          minShouldMatch: "75%"
        weightedFields:
          "[title]": 4
          "[title.standard]": 3
          "[category_names]": 2.5
          "[category_names.standard]": 2
          "[brand]": 2
          "[brand.standard]": 1.5
          "[description]": 1
          "[description.standard]": 0.8
