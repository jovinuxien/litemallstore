spring:
  application:
    name: gateway
  main:
    allow-bean-definition-overriding: true
  config:
    activate:
      on-profile: dev
  cloud:
    config:
      uri: http://configserver:8888
    bootstrap:
      enabled: true
    compatibility-verifier:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:9000" #Allow the origin of your request
            allowedMethods: "*"
            allowCredentials: true
      routes:
        - id: goods-service
          uri: lb://litemall-goods-management
          predicates:
            - Path=/goods/**
          filters:
            - TokenRelay=
            - StripPrefix=1


jhipster:
  application:
    name: gateway
  security:
    oauth2:
      audience:
        - account
        - api://default


server:
  port: 8081

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
