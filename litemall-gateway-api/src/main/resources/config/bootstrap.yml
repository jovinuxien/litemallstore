spring:
  application:
    name: gateway-api
  profiles:
    # 'db' loads litemall-db's application-db.yml (Druid datasource + MyBatis)
    # so the edge can verify credentials and persist V15 refresh tokens.
    active: default,db
  main:
    web-application-type: reactive
  # Phase 4: machine client_credentials registration (authserver). NOT OIDC
  # login — only used to mint the service token relayed downstream.
  security:
    oauth2:
      client:
        registration:
          authserver:
            client-id: gateway-api
            client-secret: gateway-api-dev-secret
            authorization-grant-type: client_credentials
            scope: svc
        provider:
          authserver:
            token-uri: http://localhost:8089/oauth2/token
  cloud:
    config:
      # Spring Cloud Config server. Non-fatal if unreachable (fail-fast not set):
      # the gateway boots from local config and logs a warning.
      uri: http://localhost:8888
      #uri: http://configserver:8888   # docker-compose network name
    bootstrap:
      enabled: true
    compatibility-verifier:
      enabled: false

server:
  port: 8090

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
