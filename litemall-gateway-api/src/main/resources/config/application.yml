spring:
  application:
    name: gateway-api
  main:
    web-application-type: reactive
  # The 'db' profile (litemall-db/application-db.yml) brings the Druid datasource
  # + Flyway. Migrations are owned by the DDD services / db module, so the
  # customer edge must NOT run them.
  flyway:
    enabled: false
  cloud:
    gateway:
      # Explicit routes only (no discovery locator) for a predictable customer edge.
      discovery:
        locator:
          enabled: false
      globalcors:
        corsConfigurations:
          '[/**]':
            # Customer SPA dev origin. Revisit when the customer SPA gets its
            # own dev port in step 4.
            allowedOrigins:
              - "http://localhost:9000"
              - "http://127.0.0.1:9000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      # Routing convention (mirrors litemall-gateway-admin): NO StripPrefix —
      # backend controllers expect the full /srv/<svc>/... path. Specific
      # prefixes first; the goods catch-all (/srv/**) is LAST so it only
      # handles what the more specific routes did not claim. MachineTokenRelayFilter
      # is a GlobalFilter and fires on every lb:// route below, relaying the
      # service machine token downstream; IdentityForwardingFilter adds the
      # trusted X-User-* customer identity. The customer self-JWT is validated
      # here and never relayed. /auth/** is served locally by AuthController
      # (a @RestController), so it needs no route entry.
      routes:
        # Protected customer surface (reachable after sign-in). Order, cart and
        # the address book all live on the order service (LitemallAddressController
        # is mounted at /srv/address there); they MUST be claimed here so they do
        # not fall through to the goods catch-all (/srv/**) below.
        # Wave-7: this route also carries POST /srv/order/webhook/stripe/order-paid.
        # Stripe cannot present a customer JWT, so PublicPaths exempts that ONE path
        # from the edge's authenticated-by-default rule; litemall-order gates it on the
        # Stripe-Signature instead. No separate route is needed — it already matches.
        - id: customer-order
          uri: lb://order-service-app
          predicates:
            - Path=/srv/order/**,/srv/cart/**,/srv/address/**
        # Wallet self-service also lives on the order service — the standalone
        # litemall-wallet-service was absorbed into litemall-order (its
        # LitemallWalletRestController is mounted at /srv/wallet there).
        - id: customer-wallet
          uri: lb://order-service-app
          predicates:
            - Path=/srv/wallet/**
        # Physical stores (pickup checkout, Wave 4) live on the order service.
        # MUST be claimed before the goods catch-all or /srv/store/** would be
        # sent to goods-management and 404.
        - id: customer-store
          uri: lb://order-service-app
          predicates:
            - Path=/srv/store/**

        # Promotion service — seckill/bargain live on master; the coupon and
        # combination/group-buy verticals arrive with fix/promotion, which
        # serves the SPA's existing legacy paths (/srv/coupon/*,
        # /srv/groupon/list) natively alongside the canonical
        # /srv/promotion/{coupon,combination}/** surface. Predicate per the
        # committed contract in litemall-promotion-service/docs/
        # spec-gateway-routes.md. Must be claimed before the goods catch-all.
        - id: customer-promotion
          uri: lb://promotion-service-app
          predicates:
            - Path=/srv/promotion/**,/srv/coupon/**,/srv/groupon/**

        # Engagement verticals on goods-management. Same resolution as the
        # catch-all below, but explicit so the customer surface is documented
        # here: collect (favorites), footprint, feedback, comment (list/count
        # live; POST /srv/comment/post pending — goods-management Wave 2,
        # see docs/handoff-goods-management-engagement.md).
        - id: customer-engagement
          uri: lb://litemall-goods-management
          predicates:
            - Path=/srv/collect/**,/srv/footprint/**,/srv/feedback/**,/srv/comment/**

        # Goods catch-all — handles /srv/catalog/**, /srv/goods/**, /srv/search,
        # /srv/suggest, /srv/category/**, etc. MUST be last among /srv/** routes
        # so the specific prefixes above win.
        - id: customer-goods
          uri: lb://litemall-goods-management
          predicates:
            - Path=/srv/**

        # Wave-13 SEO: crawlers expect the sitemap at the site root, but it is
        # generated by goods-management (contract: GET /srv/goods/sitemap.xml).
        # SetPath keeps the root URL stable while reusing the public
        # /srv/goods/** read surface downstream — the machine token is relayed
        # exactly as for any public path, so this adds NO new anonymous
        # downstream path. robots.txt needs no route: it is a static file in
        # webapp/public, served by the resource handler like the favicons.
        - id: seo-sitemap
          uri: lb://litemall-goods-management
          predicates:
            - Path=/sitemap.xml
          filters:
            - SetPath=/srv/goods/sitemap.xml

        # Wave-14.1: Meta Commerce Manager fetches the product feed at the
        # site root (doc/meta-catalog-feed.md). Same shape as seo-sitemap —
        # one cacheable public document, no new anonymous downstream path.
        # 404s harmlessly until goods-management ships the generator.
        - id: seo-meta-catalog
          uri: lb://litemall-goods-management
          predicates:
            - Path=/meta-catalog.csv
          filters:
            - SetPath=/srv/goods/meta-catalog.csv

        # Bundled customer SPA (Phase 5 webapp build -> target/classes/static).
        # Root path only; in dev the webpack dev-server on :9000 is the front
        # door and proxies /auth,/srv,/wx here, so this is a prod/default serve.
        - id: frontend
          uri: forward:/index.html
          predicates:
            - Path=/

      # Intentionally NO default TokenRelay filter: this is the customer edge,
      # not the Keycloak BFF (that is litemall-gateway-admin).

# Customer JWT realm. Distinct issuer/audience from litemall-gateway-admin so
# a customer token can never be accepted as an admin token (and vice versa).
# In dev, leave the PEM keys blank -> an ephemeral RSA pair is generated
# (logged as a warning). Supply litemall.jwt.private-key-pem /
# litemall.jwt.public-key-pem (or via litemall-config) for real use.
litemall:
  # Wave-13 SEO: absolute-URL base for the canonical/OG/JSON-LD head the edge
  # injects into product and category deep links (SeoHeadRenderer). Same
  # property name + env var (LITEMALL_PUBLIC_BASE_URL) as goods-management's
  # sitemap builder — the two MUST agree or canonical URLs diverge from
  # sitemap URLs.
  public-base-url: https://trovemo.com
  seo:
    # Identity the injected homepage head states as schema.org Organization +
    # WebSite, and the returns terms a product's Offer carries as a
    # MerchantReturnPolicy. Every value here is ALREADY published on the site
    # (footer, /returns, seller identity) — this only makes it machine-readable.
    # sameAs is assembled from litemall.social.* below, so an unconfigured
    # network stays absent instead of emitting a dead profile link.
    # Explicit placeholders, not relaxed binding (the admin-notify-email lesson).
    store-name: ${LITEMALL_SEO_STORE_NAME:Trovemo}
    contact-email: ${LITEMALL_SEO_CONTACT_EMAIL:support@trovemo.com}
    # 0 days or a blank country ⇒ the return-policy block is omitted entirely
    # rather than promising terms nobody configured.
    return-days: ${LITEMALL_SEO_RETURN_DAYS:30}
    return-country: ${LITEMALL_SEO_RETURN_COUNTRY:SE}
  auth:
    reset-mail:
      # Forgot-password-by-email flow (V37). Disabled by default:
      # /auth/reset/request and /auth/reset/confirm answer errno 701 and the
      # SPA hides the "forgot password" tab. Enabling without also enabling
      # litemall.customer-mail (below) only LOGS tokens (dev no-op sender).
      enabled: false
  # Wave-6: shared customer-mail namespace (same ENV keys configure core's
  # CustomerMailSender on the order side and the edge's SmtpResetMailSender
  # here — no code is shared, only the contract). Enabled=true binds the real
  # SMTP sender; user/pass empty = no SMTP auth (MailHog dev default).
  # Override via ENV: LITEMALL_CUSTOMER_MAIL_ENABLED / _HOST / _PORT / _USER /
  # _PASS / _FROM (dots and dashes both map to underscores for @Value lookup).
  customer-mail:
    enabled: false
    host: localhost
    port: 1025
    user: ""
    pass: ""
    from: no-reply@trovemo.com
  # Wave-6 Task A: Matomo tracker bootstrap for the customer SPA, served to
  # the browser via GET /auth/site-config. BOTH base-url and site-id set ⇒ the
  # SPA injects the tracker; either blank (the default) ⇒ /auth/site-config
  # returns nulls and the SPA stays byte-identical (no matomo script).
  # base-url is the browser-reachable Matomo root, e.g. http://localhost:8095
  # (promotion's docker-compose.marketing.yml; see its
  # docs/handoff-matomo-tracker.md for the live values).
  # Wave-7 Task B: Stripe PUBLISHABLE key, served to the browser via
  # GET /auth/site-config so the SPA can mount Stripe Elements. Blank (the
  # default) ⇒ card payment presents as cleanly unavailable and the SPA falls
  # back to wallet — never a stubbed PaymentIntent. Environment-specific, so no
  # committed fallback: override via ENV (LITEMALL_STRIPE_PUBLISHABLE_KEY).
  #
  # The SECRET key is NOT here and must never be: it belongs to litemall-order
  # (litemall.order.stripe.secret-key, ENV only). This is also deliberately not
  # litemall-core's legacy `litemall.stripe.publishedKey` block, which ships
  # committed pk_test_/sk_test_ values — see SiteConfigController's javadoc.
  stripe:
    publishable-key: ""
  # Wave-15: Meta Pixel id served to the SPA via /auth/site-config. Public by
  # design; blank ⇒ null ⇒ no pixel injected. ENV: LITEMALL_META_PIXEL_ID.
  meta:
    pixel-id: ""
  # Wave-16: Google Sign-In OAuth client id (public by design). Blank ⇒ null ⇒
  # no Google button, and /auth/google answers 707. ENV: LITEMALL_GOOGLE_CLIENT_ID.
  google:
    client-id: ""
  # Wave-16: Places autocomplete browser key (public, referrer-restricted).
  # Blank ⇒ null ⇒ plain manual address fields. ENV: LITEMALL_PLACES_API_KEY.
  places:
    api-key: ""
  tracking:
    # Behavioral Phase 0: Secure attribute on the edge-minted lm_vid/lm_sid
    # identity cookies. False here (dev serves plain http on :9000/:8090);
    # application-prod.yml turns it on behind the TLS edge.
    cookie-secure: ${LITEMALL_TRACKING_COOKIE_SECURE:false}
    matomo:
      # Self-hosted Matomo, served to the SPA via GET /auth/site-config. BLANK = OFF
      # (default): no script injected, no tracker requests, and the consent banner still
      # governs the first-party event log independently.
      #
      # These were literal ""s with no placeholder until 2026-08-26, which is why prod has
      # been running with NO analytics at all — /auth/site-config serves matomoUrl and
      # matomoSiteId as null, so "no views, no clicks" was unmeasured rather than measured
      # as zero. Explicit placeholders (plus the compose passthrough on the gateway-api
      # container) are what make activation an env change + recreate with NO rebuild.
      #
      # base-url must be the PUBLIC url the browser can reach and end with a slash, e.g.
      # https://analytics.trovemo.com/ — a container-internal host resolves to nothing in
      # the visitor's browser. site-id is the numeric id Matomo assigns the site.
      base-url: ${LITEMALL_TRACKING_MATOMO_BASE_URL:}
      site-id: ${LITEMALL_TRACKING_MATOMO_SITE_ID:}
      # Matomo custom-dimension index (visit scope "action") that carries the
      # goods id on product-detail page views. Dimension must be created in
      # Matomo admin; index 1 is the handoff default.
      goods-dimension: 1
  # Wave-9.1: footer social-profile URLs, served to the browser via
  # GET /auth/site-config. Blank ⇒ the SPA renders NO icon for that network —
  # a page that does not exist yet must be a hidden icon, never a dead link.
  # Facebook is committed (the page is live); the others go live later via ENV
  # (LITEMALL_SOCIAL_INSTAGRAM_URL / _TIKTOK_URL / _YOUTUBE_URL / _X_URL —
  # dots and dashes both map to underscores) + container recreate, no rebuild.
  social:
    facebook-url: "https://www.facebook.com/trovemo"
    instagram-url: ""
    tiktok-url: ""
    youtube-url: ""
    x-url: ""
  jwt:
    issuer: litemall-customer
    audience: litemall-customer-api
    access-ttl-seconds: 7200
    # Dev keypair so restarts do NOT invalidate logins (the ephemeral-pair gotcha).
    # DEV ONLY — production must override via env/config-server with its own keys.
