spring:
  application:
    name: gateway-api
  main:
    web-application-type: reactive
  # The 'db' profile (litemall-db/application-db.yml) brings the Druid datasource
  # + Flyway. Migrations are owned by the DDD services / db module, so the
  # customer edge must NOT run them.
  flyway:
    enabled: false
  cloud:
    gateway:
      # Explicit routes only (no discovery locator) for a predictable customer edge.
      discovery:
        locator:
          enabled: false
      globalcors:
        corsConfigurations:
          '[/**]':
            # Customer SPA dev origin. Revisit when the customer SPA gets its
            # own dev port in step 4.
            allowedOrigins:
              - "http://localhost:9000"
              - "http://127.0.0.1:9000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      # Routing convention (mirrors litemall-gateway-admin): NO StripPrefix —
      # backend controllers expect the full /srv/<svc>/... path. Specific
      # prefixes first; the goods catch-all (/srv/**) is LAST so it only
      # handles what the more specific routes did not claim. MachineTokenRelayFilter
      # is a GlobalFilter and fires on every lb:// route below, relaying the
      # service machine token downstream; IdentityForwardingFilter adds the
      # trusted X-User-* customer identity. The customer self-JWT is validated
      # here and never relayed. /auth/** is served locally by AuthController
      # (a @RestController), so it needs no route entry.
      routes:
        # Customer API surface. wx-api is not Eureka-registered -> direct URI.
        # wx-api moved off 8082 (collided with goods-management) -> 8084.
        - id: customer-wx-api
          uri: http://localhost:8084
          predicates:
            - Path=/wx/**

        # Protected customer surface (reachable after sign-in). Order, cart and
        # the address book all live on the order service (LitemallAddressController
        # is mounted at /srv/address there); they MUST be claimed here so they do
        # not fall through to the goods catch-all (/srv/**) below.
        - id: customer-order
          uri: lb://order-service-app
          predicates:
            - Path=/srv/order/**,/srv/cart/**,/srv/address/**
        # Wallet self-service also lives on the order service — the standalone
        # litemall-wallet-service was absorbed into litemall-order (its
        # LitemallWalletRestController is mounted at /srv/wallet there).
        - id: customer-wallet
          uri: lb://order-service-app
          predicates:
            - Path=/srv/wallet/**

        # Promotion service — seckill/bargain live on master; the coupon and
        # combination/group-buy verticals arrive with fix/promotion, which
        # serves the SPA's existing legacy paths (/srv/coupon/*,
        # /srv/groupon/list) natively alongside the canonical
        # /srv/promotion/{coupon,combination}/** surface. Predicate per the
        # committed contract in litemall-promotion-service/docs/
        # spec-gateway-routes.md. Must be claimed before the goods catch-all.
        - id: customer-promotion
          uri: lb://promotion-service-app
          predicates:
            - Path=/srv/promotion/**,/srv/coupon/**,/srv/groupon/**

        # Engagement verticals on goods-management. Same resolution as the
        # catch-all below, but explicit so the customer surface is documented
        # here: collect (favorites), footprint, feedback, comment (list/count
        # live; POST /srv/comment/post pending — goods-management Wave 2,
        # see docs/handoff-goods-management-engagement.md).
        - id: customer-engagement
          uri: lb://litemall-goods-management
          predicates:
            - Path=/srv/collect/**,/srv/footprint/**,/srv/feedback/**,/srv/comment/**

        # Goods catch-all — handles /srv/catalog/**, /srv/goods/**, /srv/search,
        # /srv/suggest, /srv/category/**, etc. MUST be last among /srv/** routes
        # so the specific prefixes above win.
        - id: customer-goods
          uri: lb://litemall-goods-management
          predicates:
            - Path=/srv/**

        # Bundled customer SPA (Phase 5 webapp build -> target/classes/static).
        # Root path only; in dev the webpack dev-server on :9000 is the front
        # door and proxies /auth,/srv,/wx here, so this is a prod/default serve.
        - id: frontend
          uri: forward:/index.html
          predicates:
            - Path=/

      # Intentionally NO default TokenRelay filter: this is the customer edge,
      # not the Keycloak BFF (that is litemall-gateway-admin).

# Customer JWT realm. Distinct issuer/audience from litemall-gateway-admin so
# a customer token can never be accepted as an admin token (and vice versa).
# In dev, leave the PEM keys blank -> an ephemeral RSA pair is generated
# (logged as a warning). Supply litemall.jwt.private-key-pem /
# litemall.jwt.public-key-pem (or via litemall-config) for real use.
litemall:
  jwt:
    issuer: litemall-customer
    audience: litemall-customer-api
    access-ttl-seconds: 7200
    private-key-pem: ""
    public-key-pem: ""

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
