pagehelper:
  helperDialect:  mysql
  reasonable: true
  supportMethodsArguments:  true
  params: count=countSql

spring:
  datasource:
    druid:
      url:  jdbc:mysql://localhost:3306/litemall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&verifyServerCertificate=false&useSSL=false
      driver-class-name:  com.mysql.cj.jdbc.Driver
      username:  litemall
      password:  Calliste_1006
      initial-size:  10
      max-active:  50
      min-idle:  10
      max-wait:  60000
      pool-prepared-statements:  true
      max-pool-prepared-statement-per-connection-size:  20
      validation-query:  SELECT 1 FROM DUAL
      test-on-borrow:  false
      test-on-return:  false
      test-while-idle:  true
      time-between-eviction-runs-millis:  60000
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: false
      filter:
        stat:
          enabled: false
  main:
    allow-circular-references: true
#    hikari:
#      max-pool-size: 10
#      minimum-idle: 2
#      idle-timeout: 60000
#      connection-timeout: 30000
#  jpa:
#    hibernate:
#      ddl-auto: none
#    show-sql:
#      true
#    properties:
#      hibernate:
#        format_sql: true
#        connection:
#          default_read_only: true
  devtools:
    restart:
      enabled: false
      poll-interval: 2s
      quiet-period: 1s
  flyway:
    enabled: true
    # baseline-on-migrate: marks an existing DB as already at V1 without running V1.
    # Set to true the first time you apply migrations to an existing database.
    # After the first run you can leave it true — it becomes a no-op once the baseline row exists.
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true
    out-of-order: false
    encoding: UTF-8
    # The shared `litemall` dev DB was migrated by the promotion branch, which
    # applied V17 (add combination) + V18 (add promotion campaign). Those files
    # don't exist in master's litemall-db (master's CJ snapshot was renumbered
    # V17 -> V19 to dodge the version collision), so Flyway flags them as
    # "missing" applied migrations and halts every service. Ignore ONLY that
    # category — checksum and all other validation rules stay on. Drop this once
    # promotion's V17/V18 are merged into master's litemall-db lineage.
    # *:future is required as well: setting this property REPLACES Flyway 9's
    # default ("*:future"), and a worktree migration numbered ABOVE this jar's
    # max (e.g. V26 widen_cj_category_id applied by the goods-management
    # worktree while this lineage tops out lower) is flagged "future", halting
    # every OTHER service on the shared DB. This profile file also overrides
    # each service's own spring.flyway.* (profile-specific wins), so it is the
    # one place the pattern must be right.
    ignore-migration-patterns: "*:missing,*:future"
    # Flyway uses its own JDBC connection independent of Druid.
    # Mirror the same coordinates used by the Druid pool above.
    url: jdbc:mysql://localhost:3306/litemall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&verifyServerCertificate=false&useSSL=false
    user: litemall
    password: Calliste_1006
mybatis:
  type-aliases-package: org.linlinjava.litemall.db.domain
  mapper-locations:
   - classpath*:**/org/linlinjava/litemall/db/dao/*.xml
  configuration:
    map-underscore-to-camel-case: true