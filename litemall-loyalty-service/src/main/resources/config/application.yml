spring:
  application:
    name: LOYALTY-SERVICE-APP
  profiles:
    active: dev, db, core, elastic, admin, wx
litemall:
  svcsecurity:
    # Phase 4: validate the machine JWT against litemall-authserver JWKS
    # (replaces Keycloak). Dev default; config-server overrides for non-dev.
    jwk-set-uri: http://localhost:8089/oauth2/jwks

server:
  port: 8087

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

wallet:
  service:
    url: http://localhost:8088

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org:
      linlinjava:
        litemall:
          db: DEBUG

swagger:
  production: false