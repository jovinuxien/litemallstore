spring:
  application:
    name: LOYALTY-SERVICE-APP
  profiles:
    active: dev, db, core, elastic, admin, wx
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9080/realms/jhipster/protocol/openid-connect/certs

server:
  port: 8087

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

wallet:
  service:
    url: http://localhost:8088

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org:
      linlinjava:
        litemall:
          db: DEBUG

swagger:
  production: false