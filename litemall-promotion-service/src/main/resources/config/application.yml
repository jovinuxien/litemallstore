spring:
  application:
    name: PROMOTION-SERVICE-APP
  profiles:
    active: dev, db, core, elastic, admin, wx
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9080/realms/jhipster/protocol/openid-connect/certs
server:
  port: 8088
eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
goods:
  service:
    url: http://localhost:8083