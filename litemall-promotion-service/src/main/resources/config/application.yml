spring:
  application:
    name: PROMOTION-SERVICE-APP
  profiles:
    active: dev, db, core, elastic, admin, wx
  cloud:
    stream:
      default:
        contentType: application/json
      # Cross-process promotion events. StreamBridge publishes to these
      # destinations (Kafka topics) from @TransactionalEventListener(AFTER_COMMIT).
      # Single backend = Kafka, mirroring litemall-order. Broker host is
      # profile-overridable via config-server; no hardcoded host in Java.
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          auto-create-topics: true
litemall:
  svcsecurity:
    # Phase 4: validate the machine JWT against litemall-authserver JWKS
    # (replaces Keycloak). Dev default; config-server overrides for non-dev.
    jwk-set-uri: http://localhost:8089/oauth2/jwks
  promotion:
    # Phase 2 algorithmic-targeting thresholds. The single home for every RFM /
    # segmentation tuning value — the scoring/segmentation logic carries no magic
    # numbers. Profile-overridable via the config server. Boundaries are ascending
    # lists of length 4 dividing a metric into five 1..5 buckets.
    targeting:
      recency-boundaries-days: [30, 60, 120, 240]   # ≤30d → R5 … >240d → R1
      frequency-boundaries: [2, 4, 7, 12]            # ≥12 orders → F5 … <2 → F1
      monetary-boundaries: [100, 500, 1000, 5000]    # ≥5000 spend → M5 … <100 → M1
      stats-lookback-days: 365                        # window for fetching customer stats
      segments:
        champion-min-score: 4
        loyal-min-score: 3
        big-spender-min-monetary: 4
        at-risk-max-recency: 2
        at-risk-min-frequency: 3
        new-min-recency: 4
        new-max-frequency: 1
    # Wave 12 campaign schedule tick: activates due DRAFT campaigns (+ fires
    # their social drafts) and completes past-end ACTIVE ones. Default ON — it
    # only executes schedules an admin already set; the flag is an ops
    # off-switch. Like the other schedulers: no leader election, replicas:1.
    campaign:
      scheduler-enabled: ${PROMOTION_CAMPAIGN_SCHEDULER_ENABLED:true}
      tick-ms: 60000
    # Wave 18 coupon merchandising Phase 1. margin-floor is the HARD profit
    # guard (user decision 2026-08-06, no admin override): a coupon may never
    # let in-scope goods sell below cost x floor. The worst-margin basis comes
    # from goods-management POST /srv/private/admin/insight/margin-basis
    # (frozen handoff spec); when that endpoint is unreachable coupon
    # create/update FAILS CLOSED.
    coupon:
      margin-floor: ${LITEMALL_PROMOTION_COUPON_MARGIN_FLOOR:1.05}
    # Wave 2 group-buy participation ("pink") tuning: how long a group has to
    # fill (capped at the campaign end) and how often the expiry sweep runs.
    # Profile-overridable via the config server.
    groupon:
      group-ttl-hours: 24
      sweep-fixed-delay-ms: 60000
    # Phase 3 stats source selector. order = order-service RFM via Feign (default,
    # transactional truth); matomo = Matomo Reporting-API engagement; composite =
    # merge both by user id. Profile-overridable via the config server.
    stats:
      source: ${PROMOTION_STATS_SOURCE:order}
    # Phase 3 external marketing-stack ACLs. All disabled by default and every
    # host/token sourced from env (${ENV:default}) — nothing hardcoded or
    # committed; the service boots and the adapters degrade to no-ops without them.
    matomo:                                            # analytics → statistics (in)
      enabled: ${MATOMO_ENABLED:false}
      base-url: ${MATOMO_BASE_URL:http://localhost}
      auth-token: ${MATOMO_AUTH_TOKEN:}
      site-id: ${MATOMO_SITE_ID:1}
      report-method: ${MATOMO_REPORT_METHOD:UserId.getUsers}
      period: ${MATOMO_PERIOD:month}
      date: ${MATOMO_DATE:previous12}
      filter-limit: ${MATOMO_FILTER_LIMIT:5000}
    mautic:                                            # automation → delivery (out)
      enabled: ${MAUTIC_ENABLED:false}
      base-url: ${MAUTIC_BASE_URL:http://localhost}
      username: ${MAUTIC_USERNAME:}
      password: ${MAUTIC_PASSWORD:}
      user-id-field-alias: ${MAUTIC_USER_ID_FIELD:litemall_user_id}
      segment-alias-prefix: ${MAUTIC_SEGMENT_PREFIX:litemall-campaign-}
    # Wave 6 social posting (out). Platform adapters and the deal auto-poster are
    # ALL disabled by default and every credential comes from env — the service
    # boots, previews, and writes honest failed ledger rows without any Meta/
    # TikTok registration (user-side prerequisite, may land mid-wave).
    social:
      auto-post-deals: ${SOCIAL_AUTO_POST_DEALS:false}   # opt-in flash-deal auto-poster
      auto-post-sweep-ms: 60000
      share-base-url: ${SOCIAL_SHARE_BASE_URL:http://localhost:9000}  # storefront origin for UTM links
      meta:                                            # ONE app: FB Page + IG business account
        enabled: ${SOCIAL_META_ENABLED:false}
        base-url: ${SOCIAL_META_BASE_URL:https://graph.facebook.com/v19.0}
        page-id: ${SOCIAL_META_PAGE_ID:}
        page-access-token: ${SOCIAL_META_PAGE_TOKEN:}
        ig-user-id: ${SOCIAL_META_IG_USER_ID:}
      tiktok:                                          # Content Posting API (video-only)
        enabled: ${SOCIAL_TIKTOK_ENABLED:false}
        base-url: ${SOCIAL_TIKTOK_BASE_URL:https://open.tiktokapis.com}
        access-token: ${SOCIAL_TIKTOK_ACCESS_TOKEN:}
        privacy-level: ${SOCIAL_TIKTOK_PRIVACY_LEVEL:SELF_ONLY}  # unaudited apps: SELF_ONLY only
    nutch:                                             # crawl → read model (in)
      enabled: ${NUTCH_ENABLED:false}
      solr-url: ${NUTCH_SOLR_URL:http://localhost}
      core: ${NUTCH_CORE:nutch}
      query: ${NUTCH_QUERY:*:*}
      rows: ${NUTCH_ROWS:1000}
  # Wave 17 Postiz social publishing (out). Env-gated on BOTH base-url and
  # api-key — either absent keeps every /postiz endpoint on the typed
  # "not configured" errno and the admin panel hidden. Enabling later is an
  # env change + restart, no rebuild. base-url includes /api/public/v1;
  # the key is sent as a BARE Authorization header (no Bearer).
  postiz:
    base-url: ${LITEMALL_POSTIZ_BASE_URL:}
    api-key: ${LITEMALL_POSTIZ_API_KEY:}
    # Storefront origin for composed links AND images — the social platforms
    # must be able to fetch both, so even the dev pilot points at prod.
    public-base-url: ${LITEMALL_POSTIZ_PUBLIC_BASE_URL:https://trovemo.com}
server:
  port: 8088
eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
goods:
  service:
    # Also the base URL for the Wave-18 margin-basis guard call (machine token
    # + X-User-Roles: ROLE_ADMIN; token endpoint under litemall.goods.auth.*,
    # dev defaults in GoodsMachineTokenProvider). Prod compose injects
    # GOODS_SERVICE_URL (http://goods-management:8082); the dev default is
    # goods-management's actual dev port 8082 (the old 8083 default predated
    # any live caller of this property).
    url: ${GOODS_SERVICE_URL:http://localhost:8082}
order:
  service:
    # Phase 2: source of per-customer RFM statistics (read via Feign behind an
    # ACL). Host is profile-overridable; no hardcoded host in Java.
    url: http://localhost:8084