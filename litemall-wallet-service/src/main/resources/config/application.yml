spring:
  application:
    name: WALLET-SERVICE-APP
  profiles:
    active: dev, db, core, elastic, admin, wx
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9080/realms/jhipster/protocol/openid-connect/certs
server:
  port: 8086
eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG