spring:
  profiles:
    active: db, core, wx
  messages:
    encoding: UTF-8

server:
  # Moved off 8082 to resolve the collision with litemall-goods-management
  # (which keeps 8082). 8083 is litemall-admin-api, so 8084.
  # litemall-gateway-api routes /wx/** here.
  port: 8084

logging:
  level:
    root:  ERROR
    org.springframework:  ERROR
    org.mybatis:  ERROR
    org.linlinjava.litemall.wx:  DEBUG
    org.linlinjava.litemall:  ERROR

litemall:
  stripe:
    secret-key: sk_test_3Li1wcFBsz0AeFTSHBOGm5Yb

swagger:
  production: false

spring-doc:
  packagesToScan: "org.linlinjava.litemall.wx.web"
