pagehelper:
  helperDialect:  mysql
  reasonable: true
  supportMethodsArguments:  true
  params: count=countSql

spring:
  datasource:
    druid:
      url:  jdbc:mysql://localhost:3306/litemall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&verifyServerCertificate=false&useSSL=false
      driver-class-name:  com.mysql.cj.jdbc.Driver
      username:  litemall
      password:  Calliste_1006
      initial-size:  10
      max-active:  50
      min-idle:  10
      max-wait:  60000
      pool-prepared-statements:  true
      max-pool-prepared-statement-per-connection-size:  20
      validation-query:  SELECT 1 FROM DUAL
      test-on-borrow:  false
      test-on-return:  false
      test-while-idle:  true
      time-between-eviction-runs-millis:  60000
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: false
      filter:
        stat:
          enabled: false
  main:
    allow-circular-references: true
  #    hikari:
  #      max-pool-size: 10
  #      minimum-idle: 2
  #      idle-timeout: 60000
  #      connection-timeout: 30000
  #  jpa:
  #    hibernate:
  #      ddl-auto: none
  #    show-sql:
  #      true
  #    properties:
  #      hibernate:
  #        format_sql: true
  #        connection:
  #          default_read_only: true
  devtools:
    restart:
      enabled: false
      poll-interval: 2s
      quiet-period: 1s
mybatis:
  type-aliases-package: org.linlinjava.litemall.db.domain
  mapper-locations: classpath:org/linlinjava/litemall/db/dao/*.xml