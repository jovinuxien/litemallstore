spring:
  application:
    name: ORDER-SERVICE-APP

  import: optional:classpath:application.yml
  profiles:
    #active: db, db1, core, elastic, admin, wx
    active: dev, db, core, elastic, admin, wx
  # The shared dev DB carries migrations from sibling services that are NOT on this
  # module's classpath (e.g. V21 cj_product_detail_columns, owned by goods-management).
  # Flyway's validate would otherwise abort on "applied migration not resolved locally: 21".
  # Tolerate applied-but-missing migrations so startup proceeds; NEVER `flyway repair` the
  # shared DB. (litemall-db's application-db.yml declares this too, but it is not taking
  # effect for this service's config wiring, so it is set explicitly here.)
  # *:future must be listed too: setting this property REPLACES Flyway 9's default
  # ("*:future"), so a sibling migration numbered ABOVE this module's max (e.g. V26
  # widen_cj_category_id from goods-management, while order tops out at V25) would
  # otherwise fail validate as a "future" migration the moment that service boots.
  flyway:
    ignore-migration-patterns: "*:missing,*:future"
  messages:
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  cloud:
    # Feign on OkHttp: the default JDK transport cannot send PATCH, which CJ's
    # shopping/order/confirmOrder requires (Wave 3). Applies to all Feign clients.
    openfeign:
      okhttp:
        enabled: true
    # Wave 21: order's first INBOUND binding — promotion's GROUP_EXPIRED events
    # (bean `groupExpired` in PromotionGroupEventConsumerConfig). Outbound sends
    # keep using StreamBridge and are unaffected by the function definition.
    function:
      definition: groupExpired
    stream:
      default:
        contentType: application/json
      bindings:
        orderCreated-out-0:
          destination: litemall.order.created.v1
        orderPaymentSucceeded-out-0:
          destination: litemall.order.payment-succeeded.v1
        grouponParticipated-out-0:
          destination: litemall.groupon.participated.v1
        groupExpired-in-0:
          # Must match promotion's PromotionEventStreamBridge destination derivation:
          # GROUP_EXPIRED -> litemall.promotion.group.expired.v1
          destination: litemall.promotion.group.expired.v1
          group: litemall-order
      kafka:
        binder:
          brokers: ${litemall.kafka.brokers:localhost:9092}
          # Fail FAST when the broker is unreachable so a down Kafka never hangs customer
          # checkout. The order is the system of record; event delivery is best-effort
          # (after-commit) — a publish that can't reach the broker is logged, not awaited 60s.
          health-timeout: 2
          required-acks: 1
          producer-properties:
            max.block.ms: 1500          # cap metadata/buffer wait (default 60000) — the key anti-hang
            request.timeout.ms: 1500
            delivery.timeout.ms: 2000    # must be >= request.timeout.ms
            retries: 0
            acks: 1

  # CJ Dropshipping create-order ACL. Order owns its OWN CJ auth (token) to place
  # CJ-sourced lines via the CJ API. Host is config-driven (no hardcoded host in Java);
  # the API paths live on the Feign clients. See docs/adr-cj-order-placement.md.
  cjdropship:
    api:
      base-url: "https://developers.cjdropshipping.com/api2.0/v1"
      # CJ ship-from warehouse country (required by createOrder, code 1600300 if empty).
      # Default to China (most CJ stock); override per-deployment via litemall-config.
      from-country-code: "CN"
      # CJ logistics line (also required by createOrder). A widely-available default;
      # the proper per-route value comes from CJ's freightCalculate API (follow-up).
      logistic-name: "CJPacket Ordinary"
      # Fallback DESTINATION country for pay-first CJ fulfillment when the order row
      # carries no country_code (the checkout country picker sends one per order;
      # the address book has no country column). Empty = fail the CJ placement with
      # a clear message instead of guessing the market. Set per deployment.
      ship-to-country-code: ""
      # Wave-3 lifecycle (docs/adr-cj-lifecycle-parity.md): createOrderV2 is sent with
      # payType=3 (create-only draft — no CJ money moves inside the pay transaction);
      # the post-commit hook + status-sync poller then confirm and, when auto-pay-balance
      # is on, pay the order from the CJ account balance. sandbox=true makes CJ simulate
      # that payment (isSandbox=1, no real charges) — dev default; prod sets
      # LITEMALL_ORDER_CJ_SANDBOX=false (Wave-23 arming: a simulated placement
      # answering an admin approval would be a fake success).
      sandbox: ${LITEMALL_ORDER_CJ_SANDBOX:true}
      auto-pay-balance: true
      # IOSS declaration for EU destinations — createOrderV2 rejects EU orders without
      # one (100104/7001). 0 (default) = OMIT the field: CJ then applies the account's
      # dashboard IOSS Option (Profile > IOSS Setting — "Declare with CJ's IOSS" per
      # country, or an own-IOSS entry), which is CJ's documented flow for orders that
      # don't carry an IOSS. Explicit values if ever needed: 1 = no IOSS (live-tested:
      # CJ still demands a number for EU), 2 = own IOSS (set ioss-number too),
      # 3 = CJ IOSS service (live-tested: also demands a number unless the dashboard
      # setting is active). Per-deployment decision.
      ioss-type: ${CJ_IOSS_TYPE:0}
      ioss-number: ${CJ_IOSS_NUMBER:}
      # createOrderV2 also rejects a missing/invalid customer email (3001). The ordering
      # user's email is used when present; this store contact is the fallback.
      customer-email-fallback: ${CJ_CUSTOMER_EMAIL_FALLBACK:orders@litemall.dev}
      # CJ credentials come from the environment ONLY (handoff-secrets-wave7: no committed
      # fallback). BOTH empty = CJ DISABLED: payment still settles, paid CJ orders are
      # retained by the placement sweep and placed once the key appears (CjTokenService /
      # CjPlacementSweepScheduler). Exactly one set = deployment mistake, boot fails.
      # LITEMALL_CJ_API_KEY is honored first because the prod compose stack already
      # injects the key under that name.
      auth:
        cj-email: ${CJ_EMAIL:}
        cj-api-key: ${LITEMALL_CJ_API_KEY:${CJ_API_KEY:}}


litemall:
  svcsecurity:
    # Phase 4: validate the machine JWT against litemall-authserver JWKS
    # (replaces Keycloak OIDC/resource-server). Dev default; config-server
    # overrides for non-dev.
    jwk-set-uri: http://localhost:8089/oauth2/jwks
    # Anonymous paths served by THIS service (svcsecurity is deny-by-default and
    # this list REPLACES the starter's defaults — which only cover goods-side
    # paths anyway). /srv/store/** is the customer store directory (Wave 4,
    # pickup): browsing stores needs no identity. Everything else (incl. the rest
    # of /srv/order/**) keeps requiring the gateway's machine token.
    #
    # The Stripe webhook (Wave 7) is the ONLY other anonymous path: Stripe cannot
    # present a machine token, so it is authenticated by its Stripe-Signature
    # instead — StripeWebhookController verifies it and 400s otherwise. Being
    # public it receives NO X-User-* identity, so the handler resolves the order
    # from the (signed) payload.
    public-paths:
      - /actuator/health/**
      - /srv/store/**
      - /srv/order/webhook/stripe/**
  order:
    # Wave 4 (Task B): in-store pickup kill-switch. Flipping to false 422s NEW
    # pickup submits; existing pickup orders still read/write-off normally.
    pickup-enabled: true
    # DB-row + @Scheduled sweep for unpaid-order timeouts; see UnpaidOrderTaskScheduler.
    unpaid-sweep-ms: 60000
    # CJ status-sync poll (Wave 3): every open CJ order is re-checked at this cadence,
    # batch-capped so a sweep stays inside CJ's ~1 QPS budget. See CjOrderStatusSyncScheduler.
    cj-sync-sweep-ms: 300000
    cj-sync-batch: 20
    # CJ placement sweep (Wave 8): paid CJ orders not yet placed at CJ (the order row IS
    # the durable job — source='cj', PAID, cj_order_id NULL) are (re)placed here. Retries
    # indefinitely while CJ is disabled/unreachable; skipped entirely (cheap) when the CJ
    # credentials are empty. See CjPlacementSweepScheduler / CjPlacementService.
    cj-place-sweep-ms: 300000
    cj-place-batch: 10
    cj:
      # Wave 23 (V59): admin-gated CJ placement. 'manual' (the default) = paid CJ
      # orders wait in the durable placement queue until an admin approves them in
      # the admin panel (POST /srv/private/admin/order/{id}/cj-placement/approve);
      # only approved orders are placed by the sweep. 'auto' = pre-Wave-23 behavior
      # (place every paid CJ order as soon as CJ is configured). Any other value is
      # treated as 'manual' (fail-safe: never place without approval by accident).
      placement-mode: ${LITEMALL_ORDER_CJ_PLACEMENT_MODE:manual}
    # Ops mailbox for CJ fulfilment attention signals (terminal placement rejection,
    # CJ-side cancellation of a paid order). Blank = log-only (mail rows need the
    # litemall.customer-mail seam enabled anyway).
    cj-ops-mail: ${CJ_OPS_MAIL:}
    # Wave 4 (Task D): fulfillment seams — disabled by default. printer.provider:
    # none|yly (yly needs client-id/client-secret/machine-code/machine-secret —
    # supply via env, e.g. LITEMALL_ORDER_PRINTER_CLIENT_SECRET). express.provider:
    # none|kdniao|onepass (kdniao rides litemall-core's ExpressService — its
    # litemall.express.* keys in core's profile yml OUTRANK this file: enable via
    # env vars; onepass needs account/secret env vars).
    printer:
      provider: none
      auto-print: true
      business-name: "litemall"
    express:
      provider: none
      cache-minutes: 30
    # Wave 7 (Task A): Stripe card payments. SHIPPED DEFAULT IS DISABLED — the disabled
    # adapter REJECTS verification, so card pay returns a typed 402 and never a fake
    # success; wallet checkout is untouched. Secrets are ENV ONLY, with NO committed
    # fallback (the ${VAR:} pattern) — a key in git is a key that has leaked:
    #   LITEMALL_ORDER_STRIPE_ENABLED=true
    #   LITEMALL_ORDER_STRIPE_SECRET_KEY=sk_test_...      (boot FAILS if enabled without it)
    #   LITEMALL_ORDER_STRIPE_WEBHOOK_SECRET=whsec_...    (webhook rejects everything without it)
    #
    # NOT litemall-core's litemall.stripe.* (application-core.yml), which ships committed
    # test keys, binds no webhook field and is read by nothing but a global Stripe.apiKey
    # assignment. order is Stripe's only consumer, so it owns this namespace; retiring the
    # core block + rotating those keys is platform's (Wave-7 Task B).
    stripe:
      enabled: ${LITEMALL_ORDER_STRIPE_ENABLED:false}
      secret-key: ${LITEMALL_ORDER_STRIPE_SECRET_KEY:}
      webhook-secret: ${LITEMALL_ORDER_STRIPE_WEBHOOK_SECRET:}
      currency: ${LITEMALL_ORDER_STRIPE_CURRENCY:usd}
    # Wave 7 (Task C): tax (US sales tax + EU VAT) via Stripe Tax.
    # UNLIKE every other seam here, tax FAILS CLOSED: when enabled and the provider is
    # unreachable, checkout is BLOCKED rather than shipping an untaxed order. A missed
    # receipt is recoverable; an untaxed sale is a liability. Default-off keeps dev and
    # wallet checkout at taxPrice 0.00 with no behaviour change.
    tax:
      provider: ${LITEMALL_ORDER_TAX_PROVIDER:none}
      enabled: ${LITEMALL_ORDER_TAX_ENABLED:false}
      origin-country: ${LITEMALL_ORDER_TAX_ORIGIN_COUNTRY:US}
      origin-postal-code: ${LITEMALL_ORDER_TAX_ORIGIN_POSTAL_CODE:}
      origin-state: ${LITEMALL_ORDER_TAX_ORIGIN_STATE:}
  # Wave 6 (Phase C): transactional customer email (litemall-core CustomerMailSender
  # + litemall_mail_outbox sweep). SHIPPED DEFAULT IS DISABLED — listeners write no
  # rows, the sweep skips, boot is byte-identical. ENABLE VIA ENV VARS (litemall-core's
  # profile yml outranks service yml — the kdniao precedence lesson — so env is the
  # only override that always wins):
  #   LITEMALL_CUSTOMERMAIL_ENABLED=true
  #   LITEMALL_CUSTOMERMAIL_FROM=noreply@litemall.dev
  #   LITEMALL_CUSTOMERMAIL_HOST=localhost   LITEMALL_CUSTOMERMAIL_PORT=1025   (MailHog dev defaults)
  #   LITEMALL_CUSTOMERMAIL_USERNAME= / LITEMALL_CUSTOMERMAIL_PASSWORD=        (blank = no SMTP auth)
  # Sweep knobs (service-local, safe in this yml):
  customer-mail:
    sweep-ms: 60000
    sweep-batch: 50
    # Wave 23: admin mailbox notified of every PAID order (prod = contact@trovemo.com).
    # Blank (the default) = no admin notices; rides the same enabled flag + SMTP seam
    # as customer mail. Explicit placeholder because the env name doesn't relax-bind.
    admin-notify-email: ${LITEMALL_CUSTOMERMAIL_ADMIN_NOTIFY:}
  # Behavioral targeting Phase 0 (doc/behavioral-events.md): server-side value
  # signals — AFTER_COMMIT listeners write purchase/refund rows to
  # litemall_user_event. Same kill-switch name as goods-management's ingest.
  tracking:
    enabled: ${LITEMALL_TRACKING_ENABLED:true}

# Freight templates (Wave 4, Task A — docs/adr-freight-templates.md). The CODE default
# is enabled:false (legacy flat litemall_express_freight_min/value rule, byte-identical
# to pre-Wave-4); dev turns the template ladder on. combine-mode: how one cart's
# per-template groups combine — max (default, never worse than the worst group) or
# sum (crmeb-exact, silently raises multi-template carts).
freight:
  template:
    enabled: true
    combine-mode: max

server:
  port: 8085
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain

goods:
  service:
    url: http://localhost:8082

promotion:
  service:
    url: http://localhost:8088

# Goods-service client resilience: connect/read timeouts + circuit breaker with
# fallback (GoodsServiceFeignClientFallbackFactory). A goods-management outage
# fails order placement cleanly instead of hanging — see docs/adr-goods-acquisition.md.
feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      goods-service:
        connectTimeout: 2000
        readTimeout: 3000
        loggerLevel: basic
      # Promotion coupon contract at submit: same internal-service budget as goods.
      promotion-service:
        connectTimeout: 2000
        readTimeout: 3000
        loggerLevel: basic
      # CJ Dropshipping is an external API — allow longer timeouts than the internal goods service.
      cj-dropship-auth:
        connectTimeout: 3000
        readTimeout: 6000
        loggerLevel: basic
      cj-dropship-order:
        connectTimeout: 3000
        readTimeout: 8000
        loggerLevel: basic
      # Advisory submit-time stock lookup — its own client so failures never open the
      # cj-dropship-order breaker that placement depends on.
      cj-dropship-stock:
        connectTimeout: 3000
        readTimeout: 6000
        loggerLevel: basic
      # Shipment tracking (trackInfo) — read-only, 1h-cached; own client for the same reason.
      cj-dropship-tracking:
        connectTimeout: 3000
        readTimeout: 6000
        loggerLevel: basic

resilience4j:
  circuitbreaker:
    instances:
      goods-service:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
      promotion-service:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        # Coupon rejections (HTTP 400) come back as normal Responses, not exceptions,
        # so only genuine transport failures count toward opening this circuit.
      cj-dropship-order:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
      cj-dropship-stock:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
      cj-dropship-tracking:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
  timelimiter:
    instances:
      goods-service:
        timeoutDuration: 4s
      promotion-service:
        timeoutDuration: 4s
      cj-dropship-order:
        timeoutDuration: 9s
      cj-dropship-stock:
        timeoutDuration: 7s
      cj-dropship-tracking:
        timeoutDuration: 7s

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org:
      linlinjava:
        litemall:
          db: DEBUG
  #config: classpath:logback-spring.xml

swagger:
  production: false

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/