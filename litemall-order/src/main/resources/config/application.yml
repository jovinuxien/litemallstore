spring:
  application:
    name: ORDER-SERVICE-APP

  import: optional:classpath:application.yml
  profiles:
    #active: db, db1, core, elastic, admin, wx
    active: dev, db, core, elastic, admin, wx
  messages:
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB


litemall:
  svcsecurity:
    # Phase 4: validate the machine JWT against litemall-authserver JWKS
    # (replaces Keycloak OIDC/resource-server). Dev default; config-server
    # overrides for non-dev.
    jwk-set-uri: http://localhost:8089/oauth2/jwks
  order:
    # LitemallOrderUnpaidSweeper cadence. Defaults: every 60s after a 30s
    # initial delay. Override via the litemall-config repo per environment.
    unpaid-sweep-interval-ms: 60000
    unpaid-sweep-initial-delay-ms: 30000

# Spring Cloud Stream + Kafka binder. The Kafka forwarder
# (LitemallKafkaDomainEventForwarder) routes each AFTER_COMMIT domain event
# to a versioned topic via StreamBridge. Broker coords are local-dev
# defaults; the litemall-config repo should override for non-dev profiles.
spring.cloud.stream:
  default:
    contentType: application/json
  bindings:
    orderCreated-out-0:
      destination: litemall.order.created.v1
    orderPaymentSucceeded-out-0:
      destination: litemall.order.payment-succeeded.v1
    orderCancelled-out-0:
      destination: litemall.order.cancelled.v1
    grouponParticipated-out-0:
      destination: litemall.groupon.participated.v1
    couponUsed-out-0:
      destination: litemall.coupon.used.v1
  kafka:
    binder:
      brokers: localhost:9092
      auto-create-topics: true

server:
  port: 8085
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain

goods:
  service:
    url: http://localhost:8083

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org:
      linlinjava:
        litemall:
          db: DEBUG
  #config: classpath:logback-spring.xml

swagger:
  production: false

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/