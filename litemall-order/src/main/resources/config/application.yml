spring:
  application:
    name: ORDER-SERVICE-APP

  import: optional:classpath:application.yml
  profiles:
    #active: db, db1, core, elastic, admin, wx
    active: dev, db, core, elastic, admin, wx
  # The shared dev DB carries migrations from sibling services that are NOT on this
  # module's classpath (e.g. V21 cj_product_detail_columns, owned by goods-management).
  # Flyway's validate would otherwise abort on "applied migration not resolved locally: 21".
  # Tolerate applied-but-missing migrations so startup proceeds; NEVER `flyway repair` the
  # shared DB. (litemall-db's application-db.yml declares this too, but it is not taking
  # effect for this service's config wiring, so it is set explicitly here.)
  # *:future must be listed too: setting this property REPLACES Flyway 9's default
  # ("*:future"), so a sibling migration numbered ABOVE this module's max (e.g. V26
  # widen_cj_category_id from goods-management, while order tops out at V25) would
  # otherwise fail validate as a "future" migration the moment that service boots.
  flyway:
    ignore-migration-patterns: "*:missing,*:future"
  messages:
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  cloud:
    # Feign on OkHttp: the default JDK transport cannot send PATCH, which CJ's
    # shopping/order/confirmOrder requires (Wave 3). Applies to all Feign clients.
    openfeign:
      okhttp:
        enabled: true
    stream:
      default:
        contentType: application/json
      bindings:
        orderCreated-out-0:
          destination: litemall.order.created.v1
        orderPaymentSucceeded-out-0:
          destination: litemall.order.payment-succeeded.v1
        grouponParticipated-out-0:
          destination: litemall.groupon.participated.v1
      kafka:
        binder:
          brokers: ${litemall.kafka.brokers:localhost:9092}
          # Fail FAST when the broker is unreachable so a down Kafka never hangs customer
          # checkout. The order is the system of record; event delivery is best-effort
          # (after-commit) — a publish that can't reach the broker is logged, not awaited 60s.
          health-timeout: 2
          required-acks: 1
          producer-properties:
            max.block.ms: 1500          # cap metadata/buffer wait (default 60000) — the key anti-hang
            request.timeout.ms: 1500
            delivery.timeout.ms: 2000    # must be >= request.timeout.ms
            retries: 0
            acks: 1

  # CJ Dropshipping create-order ACL. Order owns its OWN CJ auth (token) to place
  # CJ-sourced lines via the CJ API. Host is config-driven (no hardcoded host in Java);
  # the API paths live on the Feign clients. See docs/adr-cj-order-placement.md.
  cjdropship:
    api:
      base-url: "https://developers.cjdropshipping.com/api2.0/v1"
      # CJ ship-from warehouse country (required by createOrder, code 1600300 if empty).
      # Default to China (most CJ stock); override per-deployment via litemall-config.
      from-country-code: "CN"
      # CJ logistics line (also required by createOrder). A widely-available default;
      # the proper per-route value comes from CJ's freightCalculate API (follow-up).
      logistic-name: "CJPacket Ordinary"
      # Fallback DESTINATION country for pay-first CJ fulfillment when the order row
      # carries no country_code (the checkout country picker sends one per order;
      # the address book has no country column). Empty = fail the CJ placement with
      # a clear message instead of guessing the market. Set per deployment.
      ship-to-country-code: ""
      # Wave-3 lifecycle (docs/adr-cj-lifecycle-parity.md): createOrderV2 is sent with
      # payType=3 (create-only draft — no CJ money moves inside the pay transaction);
      # the post-commit hook + status-sync poller then confirm and, when auto-pay-balance
      # is on, pay the order from the CJ account balance. sandbox=true makes CJ simulate
      # that payment (isSandbox=1, no real charges) — dev default; flip off in production.
      sandbox: true
      auto-pay-balance: true
      # IOSS declaration for EU destinations — createOrderV2 rejects EU orders without
      # one (100104/7001). 1 = no IOSS (buyer pays import VAT); 2 = own IOSS (set
      # ioss-number too); 3 = CJ's IOSS service. Per-deployment decision.
      ioss-type: 1
      auth:
        cj-email: "bimeni89@gmail.com"
        cj-api-key: "9520bc6b70fe45019688c5ae62be331b"


litemall:
  svcsecurity:
    # Phase 4: validate the machine JWT against litemall-authserver JWKS
    # (replaces Keycloak OIDC/resource-server). Dev default; config-server
    # overrides for non-dev.
    jwk-set-uri: http://localhost:8089/oauth2/jwks
  order:
    # DB-row + @Scheduled sweep for unpaid-order timeouts; see UnpaidOrderTaskScheduler.
    unpaid-sweep-ms: 60000
    # CJ status-sync poll (Wave 3): every open CJ order is re-checked at this cadence,
    # batch-capped so a sweep stays inside CJ's ~1 QPS budget. See CjOrderStatusSyncScheduler.
    cj-sync-sweep-ms: 300000
    cj-sync-batch: 20

server:
  port: 8085
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain

goods:
  service:
    url: http://localhost:8082

promotion:
  service:
    url: http://localhost:8088

# Goods-service client resilience: connect/read timeouts + circuit breaker with
# fallback (GoodsServiceFeignClientFallbackFactory). A goods-management outage
# fails order placement cleanly instead of hanging — see docs/adr-goods-acquisition.md.
feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      goods-service:
        connectTimeout: 2000
        readTimeout: 3000
        loggerLevel: basic
      # Promotion coupon contract at submit: same internal-service budget as goods.
      promotion-service:
        connectTimeout: 2000
        readTimeout: 3000
        loggerLevel: basic
      # CJ Dropshipping is an external API — allow longer timeouts than the internal goods service.
      cj-dropship-auth:
        connectTimeout: 3000
        readTimeout: 6000
        loggerLevel: basic
      cj-dropship-order:
        connectTimeout: 3000
        readTimeout: 8000
        loggerLevel: basic
      # Advisory submit-time stock lookup — its own client so failures never open the
      # cj-dropship-order breaker that placement depends on.
      cj-dropship-stock:
        connectTimeout: 3000
        readTimeout: 6000
        loggerLevel: basic
      # Shipment tracking (trackInfo) — read-only, 1h-cached; own client for the same reason.
      cj-dropship-tracking:
        connectTimeout: 3000
        readTimeout: 6000
        loggerLevel: basic

resilience4j:
  circuitbreaker:
    instances:
      goods-service:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
      promotion-service:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        # Coupon rejections (HTTP 400) come back as normal Responses, not exceptions,
        # so only genuine transport failures count toward opening this circuit.
      cj-dropship-order:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
      cj-dropship-stock:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
      cj-dropship-tracking:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 5
  timelimiter:
    instances:
      goods-service:
        timeoutDuration: 4s
      promotion-service:
        timeoutDuration: 4s
      cj-dropship-order:
        timeoutDuration: 9s
      cj-dropship-stock:
        timeoutDuration: 7s
      cj-dropship-tracking:
        timeoutDuration: 7s

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org:
      linlinjava:
        litemall:
          db: DEBUG
  #config: classpath:logback-spring.xml

swagger:
  production: false

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/