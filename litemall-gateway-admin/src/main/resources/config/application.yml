# Default profile — production-style. The dev profile below overrides the
# frontend route to proxy the webpack dev server. Routes live here (not in
# bootstrap.yml) so they can be overridden via the litemall-config repo.
spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
               - "http://localhost:9000"
               - "http://127.0.0.1:9000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: "3600"
      routes:
        # Convention: /srv/<svc>/** with StripPrefix=2 — namespaces each
        # backend under its own segment so they don't collide with the legacy
        # /srv/** goods route, and downstream services see /... .
        - id: goods-service
          uri: lb://litemall-goods-management
          predicates:
            - Path=/srv/goods/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: goodsService
                fallbackUri: forward:/fallback/goods
        # litemall-admin-api has no spring.application.name — not a Eureka
        # registrant — so this uses a direct http URI. Consequence:
        # MachineTokenRelayFilter (lb:// only) does NOT relay a machine token
        # on this route. Acceptable for now; revisit once admin-api joins
        # service discovery.
        - id: admin-api
          uri: http://localhost:8083
          predicates:
            - Path=/srv/admin/**
          filters:
            - StripPrefix=2
        - id: order-service
          uri: lb://order-service-app
          predicates:
            - Path=/srv/order/**
          filters:
            - StripPrefix=2
        - id: wallet-service
          uri: lb://wallet-service-app
          predicates:
            - Path=/srv/wallet/**
          filters:
            - StripPrefix=2
        - id: loyalty-service
          uri: lb://loyalty-service-app
          predicates:
            - Path=/srv/loyalty/**
          filters:
            - StripPrefix=2
        - id: promotion-service
          uri: lb://promotion-service-app
          predicates:
            - Path=/srv/promotion/**
          filters:
            - StripPrefix=2
        # Frontend SPA — served from classpath:/static (the webpack build
        # output) in the default profile. The dev profile below replaces this
        # route with a proxy to the webpack dev server on :9000.
        - id: frontend
          uri: forward:/index.html
          predicates:
            - Path=/**

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: INFO

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

---
# Dev profile — keep webpack dev server proxy for `npm run dev` workflows.
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    gateway:
      routes:
        - id: goods-service
          uri: lb://litemall-goods-management
          predicates:
            - Path=/srv/goods/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: goodsService
                fallbackUri: forward:/fallback/goods
        - id: admin-api
          uri: http://localhost:8083
          predicates:
            - Path=/srv/admin/**
          filters:
            - StripPrefix=2
        - id: order-service
          uri: lb://order-service-app
          predicates:
            - Path=/srv/order/**
          filters:
            - StripPrefix=2
        - id: wallet-service
          uri: lb://wallet-service-app
          predicates:
            - Path=/srv/wallet/**
          filters:
            - StripPrefix=2
        - id: loyalty-service
          uri: lb://loyalty-service-app
          predicates:
            - Path=/srv/loyalty/**
          filters:
            - StripPrefix=2
        - id: promotion-service
          uri: lb://promotion-service-app
          predicates:
            - Path=/srv/promotion/**
          filters:
            - StripPrefix=2
        - id: frontend
          uri: http://localhost:9000
          predicates:
            - Path=/**
          filters:
            - StripPrefix=1

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
