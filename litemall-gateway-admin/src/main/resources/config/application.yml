# Default profile — production-style. The dev profile below overrides the
# frontend route to proxy the webpack dev server. Routes live here (not in
# bootstrap.yml) so they can be overridden via the litemall-config repo.
#
# Routing convention: no StripPrefix. Backend controllers in this codebase
# all use full /srv/... paths in their @RequestMapping, so the gateway
# forwards the original path unchanged. Carve out specific /srv/<svc>/**
# prefixes for non-goods backends; goods-management is the catch-all for
# the rest of /srv/** (which covers /srv/goods, /srv/search, /srv/suggest,
# /srv/category, etc.). Route order matters — more specific prefixes
# must come BEFORE the goods catch-all.
spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
               - "http://localhost:9000"
               - "http://127.0.0.1:9000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: "3600"
      routes:
        # Specific-prefix routes first. No StripPrefix — backends expect the
        # full /srv/<svc>/... path.
        - id: order-service
          uri: lb://order-service-app
          predicates:
            - Path=/srv/order/**,/srv/cart/**
        # Wallet vertical was absorbed into litemall-order (litemall-wallet-service
        # deleted); the /srv/wallet/** surface is served by order-service.
        - id: wallet-service
          uri: lb://order-service-app
          predicates:
            - Path=/srv/wallet/**
        - id: loyalty-service
          uri: lb://loyalty-service-app
          predicates:
            - Path=/srv/loyalty/**
        - id: promotion-service
          uri: lb://promotion-service-app
          predicates:
            - Path=/srv/promotion/**
        # Admin order surface lives in order-service (not goods-management), so
        # route the admin order namespace there explicitly before the catch-all.
        - id: admin-order
          uri: lb://order-service-app
          predicates:
            - Path=/srv/private/admin/order/**
        # Goods catch-all — handles /srv/goods/**, /srv/search, /srv/suggest,
        # /srv/category/**, /srv/admin/goods/**, /srv/manufacturer/**, etc.
        # Must be LAST among /srv/** routes so the specific prefixes above win.
        - id: goods-service
          uri: lb://litemall-goods-management
          predicates:
            - Path=/srv/**
        # Frontend SPA — restricted to the root path only. Catch-all (/**)
        # combined with forward:/index.html creates a recursion through the
        # WebFlux dispatcher when the SPA isn't on the classpath, which
        # overflows the Reactor operator stack.
        - id: frontend
          uri: forward:/index.html
          predicates:
            - Path=/

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: INFO

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

---
# Dev profile — keep webpack dev server proxy for `npm run dev` workflows.
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://order-service-app
          predicates:
            - Path=/srv/order/**,/srv/cart/**
        # Wallet lives in order-service (see default profile note).
        - id: wallet-service
          uri: lb://order-service-app
          predicates:
            - Path=/srv/wallet/**
        - id: loyalty-service
          uri: lb://loyalty-service-app
          predicates:
            - Path=/srv/loyalty/**
        - id: promotion-service
          uri: lb://promotion-service-app
          predicates:
            - Path=/srv/promotion/**
        - id: admin-order
          uri: lb://order-service-app
          predicates:
            - Path=/srv/private/admin/order/**
        - id: goods-service
          uri: lb://litemall-goods-management
          predicates:
            - Path=/srv/**
        # Dev: proxy the webpack dev server. Tightened predicate so it
        # only catches paths the SPA actually serves; everything under
        # /srv/** is API and handled above.
        - id: frontend
          uri: http://localhost:9000
          predicates:
            - Path=/,/index.html,/static/**,/assets/**,/app/**,/sockjs-node/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG