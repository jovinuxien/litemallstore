spring:
  application:
    name: gateway
  main:
    allow-bean-definition-overriding: true

  config:
    activate:
      on-profile: dev
  cloud:
    config:
      uri: http://configserver:8888
    bootstrap:
      enabled: true
    compatibility-verifier:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
               - "http://localhost:9000" #Allow the origin of your request
               - "http://127.0.0.1:9000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: "3600"
      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE-APP
          predicates:
            - Path=/srv/order/**,/srv/cart/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderService
                fallbackUri: forward:/fallback/order
        - id: admin-api
          # admin-api is not a Eureka client (plain Spring Boot on 8083); the
          # config-server overrides this URI for non-dev profiles.
          uri: ${litemall.admin-api.uri:http://localhost:8083}
          predicates:
            - Path=/admin/order/**,/admin/coupon/**
        - id: goods-service
          uri: lb://litemall-goods-management
          predicates:
            - Path=/srv/**
          filters:
            # TokenRelay removed (Phase 3b): no OAuth2 client. The Phase 4
            # service machine-token filter replaces it.
            - name: CircuitBreaker
              args:
                name: goodsService
                fallbackUri: forward:/fallback/goods
        - id: frontend
          #uri: forward:/index.html  # Serves React app
          uri: http://localhost:9000 # Proxy to webpack dev server
          predicates:
            - Path=/**
          filters:
            # TokenRelay removed (Phase 3b): no OAuth2 client.
            - StripPrefix=1


