spring:
  application:
    name: gateway-admin
  profiles:
    # 'db' loads litemall-db's application-db.yml (Druid datasource + MyBatis)
    # so the edge can verify admin credentials and persist V16 refresh tokens.
    active: default,db
  main:
    web-application-type: reactive
  # The 'db' profile (litemall-db/application-db.yml) brings the Druid
  # datasource + Flyway. Migrations are owned by the DDD services / db module,
  # so the admin edge must NOT run them.
  flyway:
    enabled: false
  # Phase 4: machine client_credentials registration (authserver). NOT OIDC
  # login — only used to mint the service token relayed downstream.
  security:
    oauth2:
      client:
        registration:
          authserver:
            client-id: gateway-admin
            # Wave 7: env, no committed fallback.
            client-secret: ${GATEWAY_ADMIN_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: svc
        provider:
          authserver:
            token-uri: http://127.0.0.1:8089/oauth2/token
  cloud:
    config:
      uri: http://configserver:8888
    bootstrap:
      enabled: true
    compatibility-verifier:
      enabled: false

# Admin JWT realm. Distinct issuer/audience from litemall-gateway-api so an
# admin token can never be accepted as a customer token (and vice versa).
# In dev, leave the PEM keys blank -> an ephemeral RSA pair is generated
# (logged as a warning). Supply litemall.jwt.private-key-pem /
# litemall.jwt.public-key-pem (or via litemall-config) for real use.
litemall:
  jwt:
    issuer: litemall-admin
    audience: litemall-admin-api
    access-ttl-seconds: 7200
    # Wave 7: RSA keypair moved to env with NO committed fallback.
    #
    # The previous dev keypair was committed here in full and is in git history.
    # It signs ADMIN tokens — anyone with repo access could mint one, which is
    # precisely the "leaked machine token" scenario. Treat it as burned; the
    # replacement must be a NEW pair (docker-compose/.env.prod.example explains
    # how to generate one).
    #
    # Absent in prod => startup FAILS (see JwtKeyGuard). It must never fall back
    # to RsaKeys.generate()'s ephemeral pair, which silently invalidates every
    # token on restart and cannot be verified by any other process.
    private-key-pem: ${LITEMALL_JWT_PRIVATE_KEY_PEM:}
    public-key-pem: ${LITEMALL_JWT_PUBLIC_KEY_PEM:}

jhipster:
  clientApp:
    name: 'gateway-admin'
  mail:
    from: gateway@localhost
  api-docs:
    default-include-pattern: /srv/**
    management-include-pattern: /management/**
    title: Gateway API
    description: Gateway API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:"
    oauth2:
      audience:
        - account
        - api://default