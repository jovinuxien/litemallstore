spring:
  application:
    name: gateway-admin
  profiles:
    active: default
  main:
    web-application-type: reactive
  cloud:
    config:
      uri: http://configserver:8888
      #fail-fast: true
      #uri: http://localhost:8888
    bootstrap:
      enabled: true
    compatibility-verifier:
      enabled: false
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:9000" #Allow the origin of your request
            allowedMethods: "*"
            allowCredentials: true
      routes:
        - id: admin-api
          uri: lb://litemall-admin-api
          predicates:
            - Path=/admin/**


#        - id: wx-api
#          uri: lb://litemall-wx-api
#          predicates:
#            - Path=/wx/**


        - id: goods-service-app
          uri: lb://goods-service-app
          predicates:
            - Path=/srv/**


        - id: order-service-app
          uri: lb://order-service-app
          predicates:
            - Path=/srv/**

          filters:
            - TokenRelay=
            - StripPrefix=0

        - id: token-service
          uri: lb://litemall-auth-server # or uri: http://localhost:8085
          predicates:
            - Path=/oauth/**
          filters:
            - RemoveRequestHeader=Cookie
            #- RewritePath=/oauth/(?<segment>.*), /$\{segment}
            #- StripPrefix=0

      # Disable default sensitive headers (equivalent to zuul.sensitiveHeaders=)
      default-filters:
        - TokenRelay=
        #- RemoveRequestHeader=Cookie,Set-Cookie,Authorization
  security:
   oauth2:
     client:
        provider:
          oidc:
            issuer-uri: http://localhost:9080/realms/jhipster
        registration:
          oidc:
            client-id: web_app
            client-secret: web_app
            scope: openid, profile, email, offline_access # last one for refresh tokens
     resourceserver:
       jwt:
         jwt-set-uri: http://localhost:9080/realms/jhipster/protocol/openid-connect/certs
     audience:
       - account
       - api://default

#  datasource:
#    url: jdbc:mysql://localhost:3306/litemall
#    username: root
#    password: Calliste_1006
#    driver-class-name: com.mysql.cj.jdbc.Driver





server:
  port: 8080

eureka:
  instance:
    preferIpAddress: true
    #hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.web.security: DEBUG


jhipster:
  clientApp:
    name: 'gateway-admin'
  # By default CORS is disabled. Uncomment to enable.
  # cors:
  #   allowed-origins: "http://localhost:8100,http://localhost:9000"
  #   allowed-methods: "*"
  #   allowed-headers: "*"
  #   exposed-headers: "Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params"
  #   allow-credentials: true
  #   max-age: 1800
  mail:
    from: gateway@localhost
  api-docs:
    default-include-pattern: /srv/**
    management-include-pattern: /management/**
    title: Gateway API
    description: Gateway API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    oauth2:
      audience:
        - account
        - api://default
