spring:
  profiles:
    active: core, db
  messages:
    encoding: UTF-8

  cjdropship:
      api:
        auth:
          # Wave 7: env, no committed fallback.
          # THE CJ KEY SPRAWL: two DIFFERENT keys were committed for the same
          # account — this one (8696a1…) and 9520bc… in goods-management, order
          # and goodsapi-analytic. Whichever a service loaded decided which key
          # it authenticated with. One variable now, set once in .env.
          cj-email: ${CJ_EMAIL:}
          cj-apiKey: ${CJ_API_KEY:}
          access-url: "https://developers.cjdropshipping.com/api2.0/v1/authentication/getAccessToken"
          refresh-url: "https://developers.cjdropshipping.com/api2.0/v1/authentication/refreshAccessToken"
        category:
          category-list-_url: "https://developers.cjdropshipping.com/api2.0/v1/product/getCategory"
        product:
          list-url: "https://developers.cjdropshipping.com/api2.0/v1/product/list"
          product-detail-url: "https://developers.cjdropshipping.com/api2.0/v1/product"



logging:
  level:
    root:  ERROR
    org.springframework:  ERROR
    org.mybatis:  ERROR
    org.linlinjava.litemall.core:  DEBUG
    spring:
      devtools:
        restart:
          enabled: false
