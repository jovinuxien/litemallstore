litemall:
  # Developers should set it to their own wx related information
  wx:
    # Wave 7: secrets moved to env with NO committed fallback (`${VAR:}`), the
    # pattern established by litemall-promotion-service/application.yml:58.
    # A real app-secret was committed here and is in git history — treat it as
    # burned and rotate in the WeChat console before any non-dev use.
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    mch-id: ${WECHAT_MCH_ID:}
    mch-key: ${WECHAT_MCH_KEY:}
    notify-url: http://www.example.com/wx/order/pay-notify
    # Merchant certificate file path
    # Please refer to "Merchant Certificate"
    # 一节 https://pay.weixin.qq.com/wiki/doc/api/wxa/wxa_api.php?chapter=4_3
    key-path: xxxxx
    # Message push configuration token
    token:
    # Message push configuration AesKey
    aes-key:

  # Info for Stripe Payment
  stripe:
    # Wave 7: env, no committed fallback. The publishable key (pk_) is safe to
    # expose by design; the SECRET key was committed here AND shipped into the
    # admin browser bundle (StripeComponent.tsx) — rotate it in the Stripe
    # dashboard. Absent ⇒ the payment adapter stays disabled and returns a typed
    # error; it must never fall back to a fake success.
    publishedKey: ${STRIPE_PUBLISHABLE_KEY:}
    secretKey: ${STRIPE_SECRET_KEY:}
    webhook-url: https://www.example.com/stripe/webhook/order-paid

  #通知相关配置
  notify:
    mail:
      # Email notification configuration. Mailboxes are generally used to receive business notifications,
      # such as receiving new orders. sendto defines email recipients, usually mall operators.
      enable: false
      host: smtp.exmail.qq.com
      username: ex@ex.com.cn
      password: XXXXXXXXXXXXX
      sendfrom: ex@ex.com.cn
      sendto: ex@qq.com
      port: 465
      # Short message template notification configuration
      # Short messages are used to notify customers, such as shipping SMS notifications.
      # Please pay attention to the configuration format; please refer to the NotifyType enumeration value for template-name and template-templateId.
    sms:
      enable: false
      # If it is Tencent Cloud SMS, set the active value tencent
      # If it is Alibaba Cloud SMS, set the active value aliyun
      active: tencent
      sign: litemall
      template:
      - name: paySucceed
        templateId: 156349
      - name: captcha
        templateId: 156433
      - name: ship
        templateId: 158002
      - name: refund
        templateId: 159447
      tencent:
        appid: 111111111
        appkey: xxxxxxxxxxxxxx
      aliyun:
        regionId: xxx
        accessKeyId: xxx
        accessKeySecret: xxx

  # Kuainiao Logistics Query Configuration
  express:
    enable: false
    appId: "XXXXXXXXX"
    appKey: "XXXXXXXXXXXXXXXXXXXXXXXXX"
    vendors:
    - code: "ZTO"
      name: "中通快递"
    - code: "YTO"
      name: "圆通速递"
    - code: "YD"
      name: "韵达速递"
    - code: "YZPY"
      name: "邮政快递包裹"
    - code: "EMS"
      name: "EMS"
    - code: "DBL"
      name: "德邦快递"
    - code: "FAST"
      name: "快捷快递"
    - code: "ZJS"
      name: "宅急送"
    - code: "TNT"
      name: "TNT快递"
    - code: "UPS"
      name: "UPS"
    - code: "DHL"
      name: "DHL"
    - code: "FEDEX"
      name: "FEDEX联邦(国内件)"
    - code: "FEDEX_GJ"
      name: "FEDEX联邦(国际件)"

  # 对象存储配置
  storage:
    # 当前工作的对象存储模式，分别是local、aliyun、tencent、qiniu
    active: local
    # 本地对象存储配置信息
    local:
      storagePath: storage
      # 这个地方应该是wx模块的WxStorageController的fetch方法对应的地址
      address: http://localhost:8080/wx/storage/fetch/
    # 阿里云对象存储配置信息
    aliyun:
      endpoint: oss-cn-shenzhen.aliyuncs.com
      accessKeyId: 111111
      accessKeySecret: xxxxxx
      bucketName: litemall
    # 腾讯对象存储配置信息
    # 请参考 https://cloud.tencent.com/document/product/436/6249
    tencent:
      # Wave 7: env, no committed fallback. A real Tencent COS credential pair
      # was committed here and is in git history — rotate it in the Tencent
      # console; it can read/write the bucket below.
      secretId: ${TENCENT_COS_SECRET_ID:}
      secretKey: ${TENCENT_COS_SECRET_KEY:}
      region: ap-shanghai
      bucketName: vytech-1300096589
    # 七牛云对象存储配置信息
    qiniu:
      endpoint: http://pd5cb6ulu.bkt.clouddn.com
      accessKey: 111111
      secretKey: xxxxxx
      bucketName: litemall
